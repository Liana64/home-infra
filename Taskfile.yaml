---
version: "3"

vars:
  KUBERNETES_DIR: "{{.ROOT_DIR}}/kubernetes"
  KUBECONFIG_FILE: "{{.ROOT_DIR}}/kubeconfig"
  SCRIPTS_DIR: "{{.ROOT_DIR}}/scripts"
  SOPS_CONFIG_FILE: "{{.ROOT_DIR}}/.sops.yaml"
  AGE_DIR: "{{.HOME}}/.config/sops/age"
  AGE_FILE: "{{.AGE_DIR}}/milberry.key"
  CLUSTER: "main"
  CLUSTER_NAME: "milberry"
env:
  KUBECONFIG: "{{.KUBECONFIG_FILE}}"
  SOPS_AGE_KEY_FILE: "{{.AGE_FILE}}"

dotenv: [".env"]

includes:
  flux:
    taskfile: .taskfiles/flux.yaml
    aliases: [f]
  kubernetes:
    taskfile: .taskfiles/kubernetes.yaml
    aliases: [k]
  sops:
    taskfile: .taskfiles/sops.yaml
    aliases: [s]
  talos:
    taskfile: .taskfiles/talos.yaml
    aliases: [t]
  backup:
    taskfile: .taskfiles/backup.yaml
    aliases: [b]
  template:
    taskfile: .taskfiles/template.yaml
    aliases: [tpl]
  renovate:
    taskfile: .taskfiles/renovate.yaml
    aliases: [r]
  precommit: .taskfiles/precommit.yaml

tasks:
  default:
    silent: true
    cmds:
      - task -l

  init:
    desc: Install git hooks and setup sops age key
    cmds:
      - task: precommit:init
      - task: sops:setup

  check:
    desc: Validate the repo (pre-commit, kubeconform, sops)
    cmds:
      - task: precommit:run
      - task: kubernetes:kubeconform
      - task: sops:check

  archive:
    desc: Archive an app, e.g. "task archive APP=foo NS=home"
    requires:
      vars: [APP, NS]
    vars:
      NS_DIR: "{{.KUBERNETES_DIR}}/{{.CLUSTER}}/apps/{{.NS}}"
      DEST: "{{.KUBERNETES_DIR}}/archive/{{.NS}}"
    cmds:
      - APP={{.APP}} yq -i '.resources -= ["./" + strenv(APP) + "/ks.yaml"]' {{.NS_DIR}}/kustomization.yaml
      - mkdir -p {{.DEST}}
      - mv {{.NS_DIR}}/{{.APP}} {{.DEST}}/
    preconditions:
      - { msg: "Missing app {{.NS_DIR}}/{{.APP}}", sh: "test -d {{.NS_DIR}}/{{.APP}}" }
      - { msg: "Already archived {{.DEST}}/{{.APP}}", sh: "test ! -e {{.DEST}}/{{.APP}}" }
