---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  KUBECONFORM_SCRIPT: "{{.SCRIPTS_DIR}}/kubeconform.sh"

tasks:
  install-kubeconfig:
    desc: Install kubeconfig
    cmds:
      - mkdir -p {{.HOME}}/.kube
      - ln -sfn {{.KUBECONFIG_FILE}} {{.HOME}}/.kube/config
    preconditions:
      - msg: Missing kubeconfig
        sh: test -f {{.KUBECONFIG_FILE}}

  resources:
    desc: Gather common resources in your cluster, useful when asking for support
    cmds:
      - for: { var: resource }
        cmd: 'kubectl get {{.ITEM}} {{.CLI_ARGS | default "-A"}}'
    vars:
      resource: >-
        nodes
        gitrepositories
        kustomizations
        helmrepositories
        helmreleases
        certificates
        certificaterequests
        ingresses
        pods

  kubeconform:
    desc: Validate Kubernetes manifests with kubeconform
    cmd: bash {{.KUBECONFORM_SCRIPT}} {{.KUBERNETES_DIR}}/{{.CLUSTER}}
    preconditions:
      - msg: Missing kubeconform script
        sh: test -f {{.KUBECONFORM_SCRIPT}}

  top:
    desc: List top metrics
    cmds:
      - "kubectl top node"
      - "kubectl top pod -A"

  browse-pvc:
    desc: Browse PersistentVolumeClaims
    summary: |
      Args:
        ns: Namespace to browse PersistentVolumeClaims in (default: default)
        claim: PersistentVolumeClaim to browse (required)
    interactive: true
    cmd: "kubectl browse-pvc --namespace {{.ns}} {{.claim}}"
    vars:
      ns: '{{.ns | default "default"}}'
    requires:
      vars: ["claim"]

  drain:
    desc: Drain a node
    summary: |
      Args:
        node: Node to drain (required)
    cmd: "kubectl drain {{.node}} --ignore-daemonsets --delete-emptydir-data --force"
    requires:
      vars: ["node"]

  sync-externalsecret:
    desc: Force-sync an ExternalSecret
    summary: |
      Args:
        ns: Namespace the ExternalSecret exists in (default: default)
        name: ExternalSecret to sync (required)
    cmd: "kubectl -n {{.ns}} annotate externalsecret {{.name}} force-sync=$(date +%s) --overwrite"
    vars:
      ns: '{{.ns | default "default"}}'
    requires:
      vars: ["name"]

  drops:
    desc: Show Hubble policy drops across all nodes
    summary: |
      Args:
        ns: Namespace to filter on, either side of the flow (optional)
        app: app.kubernetes.io/name to filter on, either side of the flow (optional)
        since: Lookback window (default: 10m)
        ipv6: Include IPv6 flows (default: false)
    cmd: |
      for p in $(kubectl get pod -n kube-system -l k8s-app=cilium -o name); do
        kubectl exec -n kube-system "$p" -c cilium-agent -- hubble observe --verdict DROPPED --since {{.since}} {{if .ns}}--namespace {{.ns}}{{end}} {{if .app}}--label app.kubernetes.io/name={{.app}}{{end}} {{if ne .ipv6 "true"}}--ipv4{{end}} -o compact
      done
    vars:
      since: '{{.since | default "10m"}}'
      ipv6: '{{.ipv6 | default "false"}}'

  sanitize:
    desc: Delete pods that aren't working as intended
    cmds:
      - for: ["Evicted", "Failed", "Succeeded"]
        cmd: "kubectl delete pods --field-selector status.phase={{.ITEM}} -A --ignore-not-found=true"
