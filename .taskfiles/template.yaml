---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  TEMPLATES_DIR: "{{.KUBERNETES_DIR}}/templates"
  APPS_DIR: "{{.KUBERNETES_DIR}}/{{.CLUSTER}}/apps"
  PG_DIR: "{{.APPS_DIR}}/database/cloudnative-pg/cluster"

tasks:
  app:
    desc: Scaffold an app from the template eg "task template:app APP=foo NS=home"
    requires:
      vars: [APP, NS]
    vars:
      DEST: "{{.APPS_DIR}}/{{.NS}}/{{.APP}}"
    cmds:
      - cp -r {{.TEMPLATES_DIR}}/app {{.DEST}}
      - find {{.DEST}} -type f -exec sed -i 's/__APP__/{{.APP}}/g; s/__NS__/{{.NS}}/g' {} +
      - APP={{.APP}} yq -i '.resources = (.resources + ["./" + strenv(APP) + "/ks.yaml"] | unique)' {{.APPS_DIR}}/{{.NS}}/kustomization.yaml
    status:
      - test -d {{.DEST}}
    preconditions:
      - { msg: "Unknown namespace {{.NS}}", sh: "test -f {{.APPS_DIR}}/{{.NS}}/kustomization.yaml" }

  postgres:
    desc: Add a managed postgres role and database for an app eg "task template:postgres APP=foo NS=home"
    requires:
      vars: [APP, NS]
    vars:
      ROLE: "{{.ROLE | default .APP}}"
      DB: "{{.DB | default .APP}}"
      BW_KEY: '{{.APP | upper | replace "-" "_"}}_DB_PASSWORD'
      APP_DIR: "{{.APPS_DIR}}/{{.NS}}/{{.APP}}"
      T: "{{.TEMPLATES_DIR}}/postgres"
    env:
      APP: "{{.APP}}"
      NS: "{{.NS}}"
      ROLE: "{{.ROLE}}"
      DB: "{{.DB}}"
    cmds:
      - |
        set -eu
        id="{{.BW_ID}}"
        [ -n "$id" ] || id=$(bws secret create {{.BW_KEY}} "$(openssl rand -hex 32)" "$BWS_PROJECT_ID" -o json | jq -r .id)
        render() { sed "s/__APP__/$APP/g; s/__NS__/$NS/g; s/__ROLE__/$ROLE/g; s/__DB__/$DB/g; s/__BW_ID__/$id/g" "{{.T}}/$1"; }
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        for s in role ingress egress; do render $s.snippet.yaml > "$tmp/$s.yaml"; done
        render database.yaml > {{.PG_DIR}}/$APP-database.yaml
        yq -i '.resources = (.resources + ["./" + strenv(APP) + "-database.yaml"] | unique)' {{.PG_DIR}}/kustomization.yaml
        F=$tmp/role.yaml yq -i '.spec.managed.roles = ((.spec.managed.roles // []) + load(strenv(F)) | unique_by(.name))' {{.PG_DIR}}/postgres-1.yaml
        F=$tmp/ingress.yaml yq -i '(.spec.ingress[] | select(.fromEndpoints and .toPorts[0].ports[0].port == "5432") | .fromEndpoints) |= (. + load(strenv(F)) | unique)' {{.PG_DIR}}/networkpolicy.yaml
        [ -f {{.APP_DIR}}/app/externalsecret.yaml ] || render externalsecret.yaml > {{.APP_DIR}}/app/externalsecret.yaml
        yq -i '.resources = (.resources + ["./externalsecret.yaml"] | unique)' {{.APP_DIR}}/app/kustomization.yaml
        F=$tmp/egress.yaml yq -i '(select(.spec.endpointSelector.matchLabels."app.kubernetes.io/name" == strenv(APP)) | .spec.egress) |= (. + load(strenv(F)) | unique)' {{.APP_DIR}}/app/networkpolicy.yaml
        yq -i '.spec.dependsOn = ((.spec.dependsOn // []) + [{"name": "cloudnative-pg-cluster"}] | unique_by(.name))' {{.APP_DIR}}/ks.yaml
    status:
      - test -f {{.PG_DIR}}/{{.APP}}-database.yaml
    preconditions:
      - { msg: "Missing app {{.APP_DIR}}", sh: "test -d {{.APP_DIR}}/app" }
      - { msg: "Set BW_ID or BWS_ACCESS_TOKEN + BWS_PROJECT_ID", sh: 'test -n "{{.BW_ID}}" || { test -n "${BWS_ACCESS_TOKEN:-}" && test -n "${BWS_PROJECT_ID:-}"; }' }
