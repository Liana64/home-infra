---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  KUBECTL_CMD: "kubectl -n renovate"

tasks:
  run:
    desc: Trigger an immediate Renovate run to regenerate pull requests
    cmds:
      - "{{.KUBECTL_CMD}} delete job renovate-manual --ignore-not-found"
      - "{{.KUBECTL_CMD}} create job renovate-manual --from=cronjob/renovate"

  ls:
    desc: List Renovate branches with age and update
    silent: true
    cmds:
      - git fetch -pq origin
      - echo
      - git for-each-ref --sort=subject --format='%(refname:lstrip=3)%09%(committerdate:relative)%09%(subject)' refs/remotes/origin/renovate | column -t -s $'\t'

  merge:
    desc: Cherry-pick Renovate branches onto main as signed commits
    summary: "task renovate:merge BRANCHES='renovate/foo renovate/bar'"
    requires:
      vars: [BRANCHES]
    preconditions:
      - sh: git diff --cached --quiet
        msg: Index has staged changes; unstage or commit first
    cmds:
      - git fetch origin
      - git switch main
      - git merge --ff-only origin/main
      - for: { var: BRANCHES }
        cmd: |
          echo "Touch key to sign {{.ITEM}}"
          git cherry-pick -S --empty=drop main..origin/{{.ITEM}}
      - git verify-commit HEAD
