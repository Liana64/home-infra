---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  BOOTSTRAP_TALOS_DIR: "{{.KUBERNETES_DIR}}/{{.CLUSTER}}/bootstrap/talos"
  TALOS_CLUSTER_FILE: "{{.BOOTSTRAP_TALOS_DIR}}/cluster.yaml"
  TALOS_SCHEMATIC_FILE: "{{.BOOTSTRAP_TALOS_DIR}}/schematic.yaml"
  TALOS_SECRET_FILE: "{{.BOOTSTRAP_TALOS_DIR}}/talsecret.sops.yaml"
  TALOS_CONFIG_DIR: "{{.BOOTSTRAP_TALOS_DIR}}/clusterconfig"
  HELMFILE_FILE: "{{.KUBERNETES_DIR}}/{{.CLUSTER}}/bootstrap/helmfile.yaml.gotmpl"
  TALOSCONFIG_FILE: "{{.TALOS_CONFIG_DIR}}/talosconfig"

env:
  TALOSCONFIG: "{{.TALOSCONFIG_FILE}}"

tasks:
  bootstrap:
    desc: Bootstrap the Talos cluster
    vars:
      CP: &cp
        sh: yq '[.nodes[] | select(.role == "controlplane")][0].ip' {{.TALOS_CLUSTER_FILE}}
    cmds:
      - task: generate
      - task: apply
        vars: { insecure: true }
      - until talosctl -n {{.CP}} bootstrap; do sleep 10; done
      - task: fetch-kubeconfig
      - task: install-helm-apps
      - task: health
    preconditions:
      - &cluster
        msg: Missing Talos cluster file
        sh: test -f {{.TALOS_CLUSTER_FILE}}

  generate:
    desc: Render node configs from cluster.yaml, patches, nodes and the sops secrets bundle
    vars:
      IMAGE: &image
        sh: id=$(curl -fsS -X POST --data-binary @{{.TALOS_SCHEMATIC_FILE}} https://factory.talos.dev/schematics | jq -er .id) && echo "factory.talos.dev/nocloud-installer-secureboot/$id:$(yq .talosVersion {{.TALOS_CLUSTER_FILE}})"
    cmds:
      - |
        if [ ! -f "{{.TALOS_SECRET_FILE}}" ]; then
            talosctl gen secrets -o {{.TALOS_SECRET_FILE}}
            sops --encrypt --in-place {{.TALOS_SECRET_FILE}}
        fi
      - |
        set -eu
        c() { yq "$1" {{.TALOS_CLUSTER_FILE}}; }
        s=$(mktemp); trap 'rm -f "$s"' EXIT
        sops -d {{.TALOS_SECRET_FILE}} > "$s"
        talosctl gen config "$(c .name)" "$(c .endpoint)" --force -o {{.TALOS_CONFIG_DIR}} \
          --with-secrets "$s" --with-docs=false --with-examples=false \
          --talos-version "$(c .configContract)" --kubernetes-version "$(c .kubernetesVersion)" \
          --install-image {{.IMAGE}} \
          $(c '.patches.global[]' | sed 's|^|--config-patch=@{{.BOOTSTRAP_TALOS_DIR}}/patches/|') \
          $(c '.patches.controlplane[]' | sed 's|^|--config-patch-control-plane=@{{.BOOTSTRAP_TALOS_DIR}}/patches/|')
        for n in $(c '.nodes | keys | .[]'); do
          talosctl machineconfig patch "{{.TALOS_CONFIG_DIR}}/$(c ".nodes.$n.role").yaml" \
            --patch "@{{.BOOTSTRAP_TALOS_DIR}}/nodes/$n.yaml" -o "{{.TALOS_CONFIG_DIR}}/$n.yaml"
        done
        talosctl --talosconfig {{.TALOSCONFIG_FILE}} config endpoint $(c '.nodes[] | select(.role == "controlplane") | .ip')
        talosctl --talosconfig {{.TALOSCONFIG_FILE}} config node $(c '.nodes[].ip')
    preconditions:
      - *cluster
      - msg: Missing Sops config file
        sh: test -f {{.SOPS_CONFIG_FILE}}
      - msg: Missing Sops Age key file
        sh: test -f {{.AGE_FILE}}

  apply:
    desc: Apply Talos node configs eg "task talos:apply node=172.16.4.11" (insecure=true in maintenance mode)
    cmd: |
      for n in $(yq '.nodes | keys | .[]' {{.TALOS_CLUSTER_FILE}}); do
        ip=$(yq ".nodes.$n.ip" {{.TALOS_CLUSTER_FILE}})
        [ -z "{{.node}}" ] || [ "{{.node}}" = "$ip" ] || continue
        talosctl apply-config -n "$ip" -f "{{.TALOS_CONFIG_DIR}}/$n.yaml" {{if .insecure}}--insecure{{end}} {{.CLI_ARGS}}
      done
    preconditions:
      - *cluster

  health:
    desc: Get Talos cluster health
    cmd: talosctl health --server=false --nodes "$(talosctl config info -o json | jq -r '.endpoints[0]')"
    preconditions:
      - &talosconfig
        msg: Missing talosconfig
        sh: test -f {{.TALOSCONFIG_FILE}}
      - &talosinfo
        msg: Unable to retrieve Talos config
        sh: "talosctl config info >/dev/null 2>&1"

  fetch-kubeconfig:
    desc: Fetch kubeconfig
    vars:
      CP: *cp
    cmds:
      - until talosctl -n {{.CP}} kubeconfig {{.ROOT_DIR}} --force; do sleep 10; done
      - |-
        CLUSTER_NAME="$(yq .name {{.TALOS_CLUSTER_FILE}})"
        kubectl config rename-context admin@$CLUSTER_NAME $CLUSTER_NAME || true
        kubectl config use-context $CLUSTER_NAME
        kubectl config unset contexts.$CLUSTER_NAME.namespace
        kubectl config delete-context admin@$CLUSTER_NAME || true
    preconditions:
      - *cluster

  install-helm-apps:
    desc: Bootstrap core apps needed for Talos
    cmds:
      - until kubectl wait --for=condition=Ready=False nodes --all --timeout=600s; do sleep 10; done
      - helmfile --file {{.HELMFILE_FILE}} apply --skip-diff-on-install --suppress-diff
      - until kubectl wait --for=condition=Ready nodes --all --timeout=600s; do sleep 10; done
    preconditions:
      - msg: Missing kubeconfig
        sh: test -f {{.KUBECONFIG_FILE}}
      - msg: Missing helmfile
        sh: test -f {{.HELMFILE_FILE}}

  upgrade:
    desc: Upgrade a node to cluster.yaml's talosVersion and schematic.yaml once the cluster is healthy eg "task talos:upgrade node=172.16.4.13 [-- --reboot-mode=powercycle]"
    vars:
      IMAGE: *image
    cmds:
      - task: health
      - talosctl -n {{.node}} upgrade --image {{.IMAGE}} --timeout=10m {{.CLI_ARGS}}
    requires:
      vars: ["node"]
    preconditions:
      - *cluster
      - *talosconfig
      - *talosinfo
      - msg: Node not found
        sh: "talosctl --nodes {{.node}} get machineconfig >/dev/null 2>&1"

  upgrade-all:
    desc: Optionally back up, then upgrade nodes one at a time (control planes first), skipping current ones eg "task talos:upgrade-all [nodes=n3] [-- --reboot-mode=powercycle]"
    interactive: true
    vars:
      NODES:
        sh: '{{if .nodes}}echo {{.nodes}}{{else}}yq ".nodes | to_entries | sort_by(.value.role) | .[].key" {{.TALOS_CLUSTER_FILE}}{{end}}'
    cmds:
      - task: health
      - |
        set -e
        read -rp "Backup etcd? [Y/n] " e
        read -rp "Backup data (CNPG + volsync)? [y/N] " d
        case $e in [nN]*) ;; *) {{.TASK_EXE}} -t {{.ROOT_TASKFILE}} backup:etcd ;; esac
        case $d in [yY]*) {{.TASK_EXE}} -t {{.ROOT_TASKFILE}} backup:data ;; esac
      - for: { var: NODES }
        task: upgrade-node
        vars: { name: "{{.ITEM}}" }
      - &cnpg kubectl wait clusters.postgresql.cnpg.io -A --all --for=jsonpath='{.status.phase}'='Cluster in healthy state' --timeout=30m
      - task: health
    preconditions:
      - *cluster
      - *talosconfig
      - *talosinfo

  upgrade-node:
    internal: true
    interactive: true
    vars:
      IMAGE: *image
      IP:
        sh: yq '.nodes.{{.name}}.ip' {{.TALOS_CLUSTER_FILE}}
      VERSION:
        sh: yq .talosVersion {{.TALOS_CLUSTER_FILE}}
    status:
      - test "$(talosctl -n {{.IP}} get extensions -o json | jq -r 'select(.spec.metadata.name == "schematic").spec.metadata.version'):$(talosctl -n {{.IP}} version --short | awk '/Tag:/ {print $2}')" = "{{splitList "/" .IMAGE | last}}"
    preconditions:
      - msg: "{{.name}} is not in cluster.yaml or unreachable"
        sh: talosctl -n {{.IP}} version >/dev/null 2>&1
      - msg: "{{.name}} is more than one minor version behind {{.VERSION}}; enumerate each minor version"
        sh: test $(( $(echo {{.VERSION}} | cut -d. -f2) - $(talosctl -n {{.IP}} version --short | awk -F. '/Tag:/ {print $2}') )) -le 1
    cmds:
      - *cnpg
      - |
        set -eu
        kubectl get clusters.postgresql.cnpg.io -A -o json | jq -r '.items[] | "\(.metadata.namespace) \(.metadata.name) \(.status.currentPrimary)"' |
        while read -r ns c p; do
          [ "$(kubectl -n "$ns" get pod "$p" -o jsonpath='{.spec.nodeName}')" = {{.name}} ] || continue
          t=$(kubectl -n "$ns" get pods -l cnpg.io/cluster="$c",cnpg.io/instanceRole=replica -o json | jq -r --arg n {{.name}} '[.items[]
            | select(.spec.nodeName != $n and any(.status.conditions[]?; .type == "Ready" and .status == "True"))][0].metadata.name // empty')
          [ -n "$t" ] || { echo "$ns/$c: no ready replica off {{.name}}" >&2; exit 1; }
          kubectl -n "$ns" patch clusters.postgresql.cnpg.io "$c" --subresource=status --type=merge \
            -p "{\"status\":{\"targetPrimary\":\"$t\",\"phase\":\"Switchover in progress\",\"phaseReason\":\"Switching over to $t\"}}"
          kubectl -n "$ns" wait clusters.postgresql.cnpg.io/"$c" --for=jsonpath='{.status.currentPrimary}'="$t" --timeout=5m
        done
      - task: upgrade
        vars: { node: "{{.IP}}" }

  upgrade-k8s:
    desc: Upgrade Kubernetes to cluster.yaml's kubernetesVersion eg "task talos:upgrade-k8s [-- --dry-run]"
    vars:
      CP: *cp
      VERSION:
        sh: yq .kubernetesVersion {{.TALOS_CLUSTER_FILE}}
    cmd: talosctl -n {{.CP}} upgrade-k8s --to {{.VERSION}} {{.CLI_ARGS}}
    preconditions:
      - *cluster
      - *talosconfig
      - *talosinfo

  recover-etcd:
    desc: Re-bootstrap etcd from a talos-backup snapshot eg "task talos:recover-etcd node=172.16.4.12 snapshot=./milberry-….snap.age"
    prompt: Bootstrap etcd on {{.node}} from {{.snapshot}}? Every control plane must have had EPHEMERAL wiped.
    cmds:
      - |
        set -eu
        db=$(mktemp); trap 'rm -f "$db"' EXIT
        age -d -i "{{.AGE_FILE}}" -o "$db" "{{.snapshot}}"
        talosctl -n {{.node}} bootstrap --recover-from="$db"
    requires:
      vars: ["node", "snapshot"]
    preconditions:
      - *talosconfig
      - *talosinfo
      - msg: "Snapshot not found"
        sh: 'test -f "{{.snapshot}}"'
      - msg: "etcd on {{.node}} is not waiting for bootstrap (wipe: talosctl -n <cp> reset --graceful=false --reboot --system-labels-to-wipe=EPHEMERAL)"
        sh: "talosctl -n {{.node}} service etcd | grep -q 'STATE.*Preparing'"

  run:
    desc: Run talos command
    cmd: "talosctl {{.CLI_ARGS}}"
    preconditions:
      - *talosconfig
      - *talosinfo

  disks:
    desc: "Show PVC subscription and backing-disk usage on a node (usage: task talos:disks -- <node>)"
    cmds:
      - |
        NODE="{{.CLI_ARGS}}"
        echo "=== PVCs pinned to $NODE ==="
        kubectl get pv -o json | jq -r --arg n "$NODE" '
          def bytes: capture("(?<n>[0-9.]+)(?<u>[KMGTP]i?)") | (.n|tonumber) *
            ({"Ki":1024,"Mi":1048576,"Gi":1073741824,"Ti":1099511627776}[.u]);
          [.items[]
           | select([.spec.nodeAffinity.required.nodeSelectorTerms[]?.matchExpressions[]?
                     | select(."key"=="kubernetes.io/hostname") | .values[]] | index($n))
           | {sc: .spec.storageClassName, size: .spec.capacity.storage,
              claim: "\(.spec.claimRef.namespace)/\(.spec.claimRef.name)"}]
          | group_by(.sc) | .[] as $g
          | "── \($g[0].sc) ──",
            ($g[] | "  \(.size)\t\(.claim)"),
            "  Subscribed: \(([$g[].size | bytes] | add) / 1073741824 | floor) GiB",
            ""'
        echo "=== Backing pool usage on $NODE ==="
        kubectl debug node/$NODE -n kube-system -i --image=busybox -q --profile=general -- sh -c '
          printf "%-26s %6s %6s %6s  %s\n" "MOUNT" "SIZE" "USED" "AVAIL" "USE%"
          for p in /host/var/mnt/local-pool /host/var/openebs/local; do
            [ -d "$p" ] || continue
            df -h "$p" | awk -v p="${p#/host}" "NR==2 { printf \"%-26s %6s %6s %6s  %s\n\", p, \$2, \$3, \$4, \$5 }"
          done'
        kubectl get pods -n kube-system -o name 2>/dev/null \
          | grep "^pod/node-debugger-$NODE-" \
          | xargs -r kubectl delete -n kube-system --ignore-not-found >/dev/null
    preconditions:
      - msg: "Node not specified (usage: task talos:disks -- <node>)"
        sh: '[ -n "{{.CLI_ARGS}}" ]'

  dashboard:
    desc: Show talos dashboard for nodes
    cmd: talosctl dashboard
    preconditions:
      - *talosconfig
      - *talosinfo

  support:
    desc: Generate a talos support bundle
    cmd: "talosctl support -n {{.node}} -O {{.ROOT_DIR}}"
    requires:
      vars: ["node"]
    preconditions:
      - *talosconfig
      - *talosinfo

  destroy:
    desc: Resets nodes back to maintenance mode
    prompt: "This will destroy your cluster and reset the nodes back to maintenance mode… continue (force: {{.CLI_FORCE}})?"
    vars:
      NODES:
        sh: yq '[.nodes[].ip] | join(",")' {{.TALOS_CLUSTER_FILE}}
    cmd: talosctl -n {{.NODES}} reset --reboot {{- if eq .CLI_FORCE false }} --wipe-mode all --system-labels-to-wipe STATE --system-labels-to-wipe EPHEMERAL{{ end }} --graceful=false --wait=false
