---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  verify:
    desc: Verify flux meets the prerequisites
    cmd: flux check --pre

  bootstrap:
    desc: Bootstrap Flux into a Kubernetes cluster
    prompt: Bootstrap Flux into the '{{.CLUSTER_NAME}}' cluster ... continue?
    cmds:
      - kubectl apply --server-side --kustomize {{.KUBERNETES_DIR}}/{{.CLUSTER}}/bootstrap/flux
      - cat {{.AGE_FILE}} | kubectl -n flux-system create secret generic sops-age --from-file=age.agekey=/dev/stdin
      - sops --decrypt {{.KUBERNETES_DIR}}/{{.CLUSTER}}/flux/vars/cluster-secrets.sops.yaml | kubectl apply --server-side --filename -
      - kubectl apply --server-side --filename {{.KUBERNETES_DIR}}/{{.CLUSTER}}/flux/vars/cluster-settings.yaml
      - kubectl apply --server-side --kustomize {{.KUBERNETES_DIR}}/{{.CLUSTER}}/flux/config
      - task: github-deploy-key
    preconditions:
      - &kubeconfig
        msg: Missing kubeconfig
        sh: test -f {{.KUBECONFIG_FILE}}
      - &agekey
        msg: Missing Sops Age key file
        sh: test -f {{.AGE_FILE}}

  apply:
    desc: Apply a Flux Kustomization resource for a cluster
    summary: |
      Args:
        path: Path under apps containing the Flux Kustomization resource (ks.yaml) (required)
        ns: Namespace the Flux Kustomization exists in (default: flux-system)
    cmd: |
      flux build ks $(basename {{.path}}) \
          --namespace {{.ns}} \
          --kustomization-file {{.KUBERNETES_DIR}}/{{.CLUSTER}}/apps/{{.path}}/ks.yaml \
          --path {{.KUBERNETES_DIR}}/{{.CLUSTER}}/apps/{{.path}} \
          {{- if contains "not found" .ks }}--dry-run \{{ end }}
      | \
      kubectl apply --server-side --field-manager=kustomize-controller -f -
    requires:
      vars: ["path"]
    vars:
      ns: '{{.ns | default "flux-system"}}'
      ks:
        sh: flux --namespace {{.ns}} get kustomizations $(basename {{.path}}) 2>&1
    preconditions:
      - *kubeconfig
      - msg: Missing Flux Kustomization for app {{.path}}
        sh: test -f {{.KUBERNETES_DIR}}/{{.CLUSTER}}/apps/{{.path}}/ks.yaml

  reconcile:
    desc: Force update Flux to pull in changes from your Git repository
    cmd: flux reconcile --namespace flux-system kustomization cluster --with-source
    preconditions:
      - *kubeconfig

  github-deploy-key:
    cmds:
      - kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply --filename -
      - sops --decrypt {{.KUBERNETES_DIR}}/{{.CLUSTER}}/bootstrap/flux/github-deploy-key.sops.yaml | kubectl apply --server-side --filename -
    preconditions:
      - *kubeconfig
      - *agekey
      - msg: Missing Github deploy key file
        sh: test -f {{.KUBERNETES_DIR}}/{{.CLUSTER}}/bootstrap/flux/github-deploy-key.sops.yaml

  redo:
    desc: Force reset drift in HelmRelease
    cmds:
      - flux suspend hr {{.CLI_ARGS}}
      - flux resume hr {{.CLI_ARGS}}

  # https://github.com/fluxcd/helm-controller/issues/454#issuecomment-962208864
  retry:
    desc: Restart specific helmrelease
    cmds:
      - flux suspend hr {{.hr}} -n {{.ns}}
      - sleep 2
      - flux resume hr {{.hr}} -n {{.ns}}
    requires:
      vars: ["ns", "hr"]

  errors:
    desc: List errors from all namespaces
    cmd: flux logs -A --level=error
