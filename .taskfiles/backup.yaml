---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  KOPIA_EXEC: "kubectl exec -n volsync-system deploy/kopia -c app --"

tasks:
  postgres:
    desc: Backup a CNPG cluster on-demand, e.g. "task backup:postgres [PG=postgres-home]"
    vars:
      PG: '{{.PG | default "postgres-home"}}'
      NAME: '{{.PG}}-{{now | date "20060102-150405"}}'
    cmds:
      - |
        kubectl apply -f - <<EOF
        apiVersion: postgresql.cnpg.io/v1
        kind: Backup
        metadata:
          name: {{.NAME}}
          namespace: database
        spec:
          cluster:
            name: {{.PG}}
          method: plugin
          pluginConfiguration:
            name: barman-cloud.cloudnative-pg.io
        EOF
      - kubectl -n database wait backup/{{.NAME}} --for=jsonpath='{.status.phase}'=completed --timeout=30m

  etcd:
    desc: Snapshot etcd on-demand, e.g. "task backup:etcd"
    vars:
      NAME: talos-backup-{{now | unixEpoch}}
    cmds:
      - kubectl -n kube-system create job --from=cronjob/talos-backup {{.NAME}}
      - for i in $(seq 120); do kubectl -n kube-system get job {{.NAME}} -o jsonpath='{.status.conditions[?(@.status=="True")].type}' | grep -qE 'Complete|Failed' && break; sleep 5; done
      - kubectl -n kube-system logs job/{{.NAME}}
      - test "$(kubectl -n kube-system get job {{.NAME}} -o jsonpath='{.status.succeeded}')" = 1

  volsync:
    desc: Snapshot unpaused volsync sources via temporary copies, e.g. "task backup:volsync [APP=linkding NS=home]"
    vars:
      ID: "{{now | unixEpoch}}"
    cmds:
      - defer: kubectl delete replicationsources -A -l backup/run={{.ID}} --ignore-not-found
      - |
        kubectl get replicationsources {{if .APP}}-n {{.NS}} --field-selector metadata.name={{.APP}}{{else}}-A{{end}} -o json |
        jq --arg id {{.ID}} '{apiVersion: "v1", kind: "List", items: [.items[] | select(.spec.paused != true) | .metadata as $m | {apiVersion, kind,
          metadata: {name: "\($m.name)-manual", namespace: $m.namespace, labels: {"backup/run": $id}},
          spec: (.spec | .trigger = {manual: $id} | .kopia = {username: $m.name, hostname: $m.namespace} + .kopia)}]}' |
        kubectl create -f -
      - kubectl wait replicationsources -A -l backup/run={{.ID}} --for=jsonpath='{.status.lastManualSync}'={{.ID}} --timeout=1h
      - kubectl wait replicationsources -A -l backup/run={{.ID}} --for=jsonpath='{.status.latestMoverStatus.result}'=Successful --timeout=10s
    preconditions:
      - msg: APP requires NS
        sh: test -z "{{.APP}}" || test -n "{{.NS}}"

  data:
    desc: Snapshot every CNPG cluster and every unpaused volsync source, e.g. "task backup:data"
    vars:
      CLUSTERS:
        sh: kubectl -n database get clusters.postgresql.cnpg.io -o name | cut -d/ -f2
    cmds:
      - for: { var: CLUSTERS }
        task: postgres
        vars: { PG: "{{.ITEM}}" }
      - task: volsync

  all:
    desc: Snapshot etcd and all data, e.g. "task backup:all"
    cmds:
      - task: etcd
      - task: data

  restore:
    desc: Restore a kopia snapshot e.g. "task backup:restore APP=linkding NS=home [PREVIOUS=1]"
    prompt: Scale down {{.NS}}/{{.APP}} and overwrite its PVC with a snapshot?
    requires:
      vars: [APP, NS]
    vars:
      ID: "{{now | unixEpoch}}"
      PREVIOUS: '{{.PREVIOUS | default "0"}}'
      PVC:
        sh: kubectl -n {{.NS}} get replicationsource {{.APP}} -o jsonpath='{.spec.sourcePVC}'
      MOVER:
        sh: kubectl -n {{.NS}} get replicationsource {{.APP}} -o jsonpath='{.spec.kopia.moverSecurityContext}'
      WORKLOADS:
        sh: |
          kubectl -n {{.NS}} get deploy,sts -o json | jq -r --arg pvc {{.PVC}} '.items[]
            | select(any(.spec.template.spec.volumes[]?; .persistentVolumeClaim.claimName == $pvc))
            | "\(.kind)/\(.metadata.name)=\(.spec.replicas)"'
      RELEASES:
        sh: |
          kubectl -n {{.NS}} get deploy,sts -o json | jq -r --arg pvc {{.PVC}} '[.items[]
            | select(any(.spec.template.spec.volumes[]?; .persistentVolumeClaim.claimName == $pvc))
            | .metadata.labels["helm.toolkit.fluxcd.io/name"] // empty] | unique[]'
      PODS:
        sh: |
          kubectl -n {{.NS}} get pods -o json | jq -r --arg pvc {{.PVC}} '.items[]
            | select(.status.phase == "Running" and any(.spec.volumes[]?; .persistentVolumeClaim.claimName == $pvc))
            | "pod/\(.metadata.name)"'
    cmds:
      - defer: |
          {{if .EXIT_CODE}}
          cat >&2 <<MSG
          Restore failed: {{.PVC}} may be partial, backups are paused, the app is down.
          Inspect: kubectl -n {{.NS}} describe replicationdestination {{.APP}}-restore
          Fix and rerun, or resume as-is:
            kubectl -n {{.NS}} delete replicationdestination {{.APP}}-restore --ignore-not-found
          {{- range splitLines .WORKLOADS}}{{if .}}
            kubectl -n {{$.NS}} scale {{splitList "=" . | first}} --replicas={{splitList "=" . | last}}
          {{- end}}{{end}}
            kubectl -n {{.NS}} patch replicationsource {{.APP}} --field-manager=backup --type merge -p '{"spec":{"paused":false}}'
          {{- range splitLines .RELEASES}}{{if .}}
            flux -n {{$.NS}} resume helmrelease {{.}}
          {{- end}}{{end}}
          MSG
          {{end}}
        silent: true
      - for: { var: RELEASES }
        cmd: flux -n {{.NS}} suspend helmrelease {{.ITEM}}
      - kubectl -n {{.NS}} patch replicationsource {{.APP}} --field-manager=backup --type merge -p '{"spec":{"paused":true}}'
      - for: { var: WORKLOADS }
        cmd: kubectl -n {{.NS}} scale {{splitList "=" .ITEM | first}} --replicas=0
      - test -z "{{catLines .PODS}}" || kubectl -n {{.NS}} wait {{catLines .PODS}} --for=delete --timeout=5m
      - |
        {{if .NODE}}
        pvc=$(kubectl -n {{.NS}} get pvc {{.PVC}} -o json | jq --arg n {{.NODE}} '{apiVersion, kind,
          metadata: (.metadata | {name, namespace, labels, annotations: ((.annotations // {})
            | with_entries(select(.key | test("^(pv|volume)\\.") | not)) + {"volume.kubernetes.io/selected-node": $n})}),
          spec: (.spec | del(.volumeName))}')
        kubectl patch pv $(kubectl -n {{.NS}} get pvc {{.PVC}} -o jsonpath='{.spec.volumeName}') -p '{"spec":{"persistentVolumeReclaimPolicy":"Retain"}}'
        kubectl -n {{.NS}} delete pvc {{.PVC}} volsync-src-{{.APP}}-cache --ignore-not-found
        echo "$pvc" | kubectl create -f -
        {{end}}
      - |
        kubectl apply -f - <<EOF
        apiVersion: volsync.backube/v1alpha1
        kind: ReplicationDestination
        metadata:
          name: {{.APP}}-restore
          namespace: {{.NS}}
        spec:
          trigger:
            manual: "{{.ID}}"
          kopia:
            destinationPVC: {{.PVC}}
            copyMethod: Direct
            repository: {{.APP}}-volsync-secret
            sourceIdentity:
              sourceName: {{.APP}}
            previous: {{.PREVIOUS}}
            enableFileDeletion: true
            cacheCapacity: 5Gi
            cacheStorageClassName: openebs-hostpath
            cleanupCachePVC: true
            moverPodLabels:
              app.kubernetes.io/created-by: volsync
            moverSecurityContext: {{.MOVER}}
        EOF
      - kubectl -n {{.NS}} wait replicationdestination/{{.APP}}-restore --for=jsonpath='{.status.lastManualSync}'={{.ID}} --timeout=2h
      - kubectl -n {{.NS}} wait replicationdestination/{{.APP}}-restore --for=jsonpath='{.status.latestMoverStatus.result}'=Successful --timeout=10s
      - kubectl -n {{.NS}} delete replicationdestination {{.APP}}-restore
      - for: { var: WORKLOADS }
        cmd: kubectl -n {{.NS}} scale {{splitList "=" .ITEM | first}} --replicas={{splitList "=" .ITEM | last}}
      - kubectl -n {{.NS}} patch replicationsource {{.APP}} --field-manager=backup --type merge -p '{"spec":{"paused":false}}'
      - for: { var: RELEASES }
        cmd: flux -n {{.NS}} resume helmrelease {{.ITEM}}

  move:
    desc: Backup and restore an app onto another node, e.g. "task backup:move APP=linkding NS=home NODE=n2"
    requires:
      vars: [APP, NS, NODE]
    cmds:
      - task: volsync
        vars: { APP: "{{.APP}}", NS: "{{.NS}}" }
      - task: restore
        vars: { APP: "{{.APP}}", NS: "{{.NS}}", NODE: "{{.NODE}}" }

  list:
    desc: List postgres backups and volsync sources
    cmds:
      - kubectl -n database get backups --sort-by=.metadata.creationTimestamp
      - kubectl get replicationsources -A

  snapshots:
    desc: List kopia snapshots across all sources
    cmd: "{{.KOPIA_EXEC}} kopia snapshot list --all {{.CLI_ARGS}}"

  stats:
    desc: Show kopia repository content + storage stats
    cmds:
      - "{{.KOPIA_EXEC}} kopia repository status"
      - "{{.KOPIA_EXEC}} kopia content stats"
