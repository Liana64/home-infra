---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  KOPIA_EXEC: "kubectl exec -n volsync-system deploy/kopia -c app --"

tasks:
  postgres:
    desc: Take an on-demand postgres-1 backup eg "task backup:postgres"
    vars:
      NAME: postgres-1-{{now | date "20060102-150405"}}
    cmds:
      - |
        kubectl apply -f - <<EOF
        apiVersion: postgresql.cnpg.io/v1
        kind: Backup
        metadata:
          name: {{.NAME}}
          namespace: database
        spec:
          cluster:
            name: postgres-1
          method: plugin
          pluginConfiguration:
            name: barman-cloud.cloudnative-pg.io
        EOF
      - kubectl -n database wait backup/{{.NAME}} --for=jsonpath='{.status.phase}'=completed --timeout=30m

  etcd:
    desc: Take an on-demand etcd snapshot to s3://etcd eg "task backup:etcd"
    vars:
      NAME: talos-backup-{{now | unixEpoch}}
    cmds:
      - kubectl -n kube-system create job --from=cronjob/talos-backup {{.NAME}}
      - for i in $(seq 120); do kubectl -n kube-system get job {{.NAME}} -o jsonpath='{.status.conditions[?(@.status=="True")].type}' | grep -qE 'Complete|Failed' && break; sleep 5; done
      - kubectl -n kube-system logs job/{{.NAME}}
      - test "$(kubectl -n kube-system get job {{.NAME}} -o jsonpath='{.status.succeeded}')" = 1

  volsync:
    desc: Take an on-demand volsync snapshot of an app eg "task backup:volsync APP=linkding NS=home"
    requires:
      vars: [APP, NS]
    vars:
      ID: "{{now | unixEpoch}}"
    cmds:
      - kubectl -n {{.NS}} patch replicationsource {{.APP}} --type merge -p '{"spec":{"trigger":{"manual":"{{.ID}}"}}}'
      - kubectl -n {{.NS}} wait replicationsource/{{.APP}} --for=jsonpath='{.status.lastManualSync}'={{.ID}} --timeout=30m

  restore:
    desc: Overwrite an app's PVC with a kopia snapshot eg "task backup:restore APP=linkding NS=home [PREVIOUS=1]"
    prompt: Scale down {{.NS}}/{{.APP}} and overwrite its PVC with a snapshot?
    requires:
      vars: [APP, NS]
    vars:
      ID: "{{now | unixEpoch}}"
      PREVIOUS: '{{.PREVIOUS | default "0"}}'
      PVC:
        sh: kubectl -n {{.NS}} get replicationsource {{.APP}} -o jsonpath='{.spec.sourcePVC}'
      MOVER:
        sh: kubectl -n {{.NS}} get replicationsource {{.APP}} -o jsonpath='{.spec.kopia.moverSecurityContext}'
      WORKLOADS:
        sh: |
          kubectl -n {{.NS}} get deploy,sts -o json | jq -r --arg pvc {{.PVC}} '.items[]
            | select(any(.spec.template.spec.volumes[]?; .persistentVolumeClaim.claimName == $pvc))
            | "\(.kind)/\(.metadata.name)=\(.spec.replicas)"'
      RELEASES:
        sh: |
          kubectl -n {{.NS}} get deploy,sts -o json | jq -r --arg pvc {{.PVC}} '[.items[]
            | select(any(.spec.template.spec.volumes[]?; .persistentVolumeClaim.claimName == $pvc))
            | .metadata.labels["helm.toolkit.fluxcd.io/name"] // empty] | unique[]'
      PODS:
        sh: |
          kubectl -n {{.NS}} get pods -o json | jq -r --arg pvc {{.PVC}} '.items[]
            | select(.status.phase == "Running" and any(.spec.volumes[]?; .persistentVolumeClaim.claimName == $pvc))
            | "pod/\(.metadata.name)"'
    cmds:
      - defer: |
          {{if .EXIT_CODE}}
          cat >&2 <<MSG
          Restore failed: {{.PVC}} may be partial, backups are paused, the app is down.
          Inspect: kubectl -n {{.NS}} describe replicationdestination {{.APP}}-restore
          Fix and rerun, or resume as-is:
            kubectl -n {{.NS}} delete replicationdestination {{.APP}}-restore --ignore-not-found
          {{- range splitLines .WORKLOADS}}{{if .}}
            kubectl -n {{$.NS}} scale {{splitList "=" . | first}} --replicas={{splitList "=" . | last}}
          {{- end}}{{end}}
            kubectl -n {{.NS}} patch replicationsource {{.APP}} --type merge -p '{"spec":{"paused":false}}'
          {{- range splitLines .RELEASES}}{{if .}}
            flux -n {{$.NS}} resume helmrelease {{.}}
          {{- end}}{{end}}
          MSG
          {{end}}
        silent: true
      - for: { var: RELEASES }
        cmd: flux -n {{.NS}} suspend helmrelease {{.ITEM}}
      - kubectl -n {{.NS}} patch replicationsource {{.APP}} --type merge -p '{"spec":{"paused":true}}'
      - for: { var: WORKLOADS }
        cmd: kubectl -n {{.NS}} scale {{splitList "=" .ITEM | first}} --replicas=0
      - test -z "{{catLines .PODS}}" || kubectl -n {{.NS}} wait {{catLines .PODS}} --for=delete --timeout=5m
      - |
        kubectl apply -f - <<EOF
        apiVersion: volsync.backube/v1alpha1
        kind: ReplicationDestination
        metadata:
          name: {{.APP}}-restore
          namespace: {{.NS}}
        spec:
          trigger:
            manual: "{{.ID}}"
          kopia:
            destinationPVC: {{.PVC}}
            copyMethod: Direct
            repository: {{.APP}}-volsync-secret
            sourceIdentity:
              sourceName: {{.APP}}
            previous: {{.PREVIOUS}}
            enableFileDeletion: true
            cacheCapacity: 5Gi
            cacheStorageClassName: openebs-hostpath
            cleanupCachePVC: true
            moverPodLabels:
              app.kubernetes.io/created-by: volsync
            moverSecurityContext: {{.MOVER}}
        EOF
      - kubectl -n {{.NS}} wait replicationdestination/{{.APP}}-restore --for=jsonpath='{.status.lastManualSync}'={{.ID}} --timeout=2h
      - kubectl -n {{.NS}} wait replicationdestination/{{.APP}}-restore --for=jsonpath='{.status.latestMoverStatus.result}'=Successful --timeout=10s
      - kubectl -n {{.NS}} delete replicationdestination {{.APP}}-restore
      - for: { var: WORKLOADS }
        cmd: kubectl -n {{.NS}} scale {{splitList "=" .ITEM | first}} --replicas={{splitList "=" .ITEM | last}}
      - kubectl -n {{.NS}} patch replicationsource {{.APP}} --type merge -p '{"spec":{"paused":false}}'
      - for: { var: RELEASES }
        cmd: flux -n {{.NS}} resume helmrelease {{.ITEM}}

  list:
    desc: List postgres backups and volsync sources
    cmds:
      - kubectl -n database get backups --sort-by=.metadata.creationTimestamp
      - kubectl get replicationsources -A

  snapshots:
    desc: List kopia snapshots across all sources
    cmd: "{{.KOPIA_EXEC}} kopia snapshot list --all {{.CLI_ARGS}}"

  stats:
    desc: Show kopia repository content + storage stats
    cmds:
      - "{{.KOPIA_EXEC}} kopia repository status"
      - "{{.KOPIA_EXEC}} kopia content stats"
