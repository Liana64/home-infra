---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      minecraft:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/itzg/minecraft-server
              tag: 2026.7.2@sha256:6ec1110e4d9236d00ae9436a3e4a5929583e5b19cc94b756a7c603f7cf647a77
            env:
              EULA: true
              SERVER_NAME: Shoujo Magical Gamers
              MOTD: "Minecraft Server"
              MAX_PLAYERS: 16
              MODE: survival
              VERSION: "26.2"
              DIFFICULTY: normal
              LEVEL: world
              MEMORY: 2560M
              ENABLE_WHITELIST: true
              MAX_TICK_TIME: -1
              MAX_WORLD_SIZE: 29999984
              VIEW_DISTANCE: 12
              MAX_BUILD_HEIGHT: 320
              SPAWN_PROTECTION: 0
              ENABLE_AUTOPAUSE: true
              AUTOPAUSE_TIMEOUT_EST: 600
              AUTOPAUSE_TIMEOUT_INIT: 300
              FORCE_GAMEMODE: true
              OVERRIDE_ICON: true
              ICON: https://i.ibb.co/q7PkGt4/shoujomagical.png
              TYPE: MODRINTH
              MODRINTH_MODPACK: vanilla-perfected
              MODRINTH_VERSION: 1.0.3+26.2
              MODRINTH_LOADER: fabric
            envFrom:
              - secretRef:
                  name: minecraft-secret
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: true
              capabilities:
                add: ["NET_RAW"]
                drop: ["ALL"]
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  periodSeconds: 60
                  exec: &probeexec { command: ["mc-health"] }
              readiness: *probe
              startup:
                <<: *probe
                spec:
                  initialDelaySeconds: 30
                  periodSeconds: 1
                  failureThreshold: 900
                  exec: *probeexec
          backup:
            image:
              repository: docker.io/itzg/mc-backup
              tag: 2026.7.3@sha256:e1b9133777e99fe58be14690a4c93c8053efdc49e3f69fc67b0932b666ee2e33
            env:
              RCON_HOST: 127.0.0.1
              BACKUP_INTERVAL: 4h
              PRUNE_BACKUPS_DAYS: 7
              PAUSE_IF_NO_PLAYERS: true
              TAR_COMPRESS_METHOD: zstd
              EXCLUDES: "*.jar,cache,logs,libraries,mods"
            envFrom:
              - secretRef:
                  name: minecraft-secret
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        pod:
          terminationGracePeriodSeconds: 120
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - "n2"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: Always
    service:
      app:
        controller: minecraft
        annotations:
          external-dns.alpha.kubernetes.io/hostname: "shoujo.${ORG_DOMAIN}"
          external-dns.alpha.kubernetes.io/target: "mc-router.${ORG_DOMAIN}"
          mc-router.itzg.me/externalServerName: shoujo.${ORG_DOMAIN}
        ports:
          minecraft:
            port: 25565
    persistence:
      data:
        storageClass: cluster-nvme
        accessMode: ReadWriteOnce
        size: 32Gi
        retain: true
        globalMounts:
          - path: /data
      backups:
        storageClass: cluster-nvme
        accessMode: ReadWriteOnce
        size: 64Gi
        retain: true
        advancedMounts:
          minecraft:
            backup:
              - path: /backups
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        globalMounts:
          - path: /tmp
