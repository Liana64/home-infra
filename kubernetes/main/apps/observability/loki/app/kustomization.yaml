---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./prometheusrule.yaml
configMapGenerator:
  - name: loki-rules
    files:
      - ./rules/alerts.yaml
generatorOptions:
  disableNameSuffixHash: true
