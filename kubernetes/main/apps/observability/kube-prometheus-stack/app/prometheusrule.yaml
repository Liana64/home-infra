---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: miscellaneous-rules
spec:
  groups:
    - name: zfs
      rules:
        - alert: ZfsPoolUnhealthy
          annotations:
            summary: ZFS pool {{ $labels.pool }} on {{ $labels.host }} is unhealthy (state {{ $value }}, 1=degraded 2=faulted 3=offline 4=unavail 5=removed 6=suspended)
          expr: zfs_pool_health > 0
          for: 5m
          labels:
            severity: critical
        - alert: ZfsExporterAbsent
          annotations:
            summary: zfs_pool_health has no series — m1 zfs exporter down or scrape unwired
          expr: absent(zfs_pool_health)
          for: 6h
          labels:
            severity: warning
        - alert: ZfsSnapshotStale
          annotations:
            summary: Newest snapshot of {{ $labels.dataset }} is {{ $value | humanizeDuration }} old — sanoid autosnap stalled
          expr: time() - zfs_snapshot_latest_time_seconds{dataset!~"tank/backups(/.*)?|tank/users/stash/shared/landfill"} > 3 * 3600
          for: 30m
          labels:
            severity: warning
        - alert: ZfsVolsyncSnapshotStale
          annotations:
            summary: Newest volsync repo snapshot is {{ $value | humanizeDuration }} old — daily sanoid snap missed
          expr: time() - zfs_snapshot_latest_time_seconds{dataset="tank/backups/volsync"} > 26 * 3600
          for: 1h
          labels:
            severity: warning
        - alert: ZfsSnapshotMetricsAbsent
          annotations:
            summary: zfs_snapshot_latest_time_seconds has no series — zfs-snapshot-metrics timer on m1 dead
          expr: absent(zfs_snapshot_latest_time_seconds)
          for: 6h
          labels:
            severity: warning
        - alert: ZfsPoolFilling
          annotations:
            summary: ZFS pool {{ $labels.pool }} on {{ $labels.host }} is down to {{ $value | humanizePercentage }} free on disk — ZFS slows down past 80% full
          expr: zfs_pool_free_bytes / zfs_pool_size_bytes < 0.2 >= 0.1
          for: 1h
          labels:
            severity: warning
        - alert: ZfsPoolFull
          annotations:
            summary: ZFS pool {{ $labels.pool }} on {{ $labels.host }} is down to {{ $value | humanizePercentage }} free on disk — writes fail when it fills
          expr: zfs_pool_free_bytes / zfs_pool_size_bytes < 0.1
          for: 15m
          labels:
            severity: critical
        - alert: ZfsQuotaFilling
          annotations:
            summary: ZFS dataset {{ $labels.name }} on {{ $labels.host }} is at {{ $value | humanizePercentage }} of its quota — raise it in storage.nix or prune
          expr: ((zfs_dataset_used_bytes / (zfs_dataset_quota_bytes > 0)) or (zfs_dataset_referenced_bytes / (zfs_dataset_referenced_quota_bytes > 0))) > 0.9 <= 0.98
          for: 1h
          labels:
            severity: warning
        - alert: ZfsQuotaFull
          annotations:
            summary: ZFS dataset {{ $labels.name }} on {{ $labels.host }} is at {{ $value | humanizePercentage }} of its quota — writes to it fail when it fills
          expr: ((zfs_dataset_used_bytes / (zfs_dataset_quota_bytes > 0)) or (zfs_dataset_referenced_bytes / (zfs_dataset_referenced_quota_bytes > 0))) > 0.98
          for: 15m
          labels:
            severity: critical
    - name: smart
      rules:
        - alert: SmartDeviceUnhealthy
          annotations:
            summary: Disk {{ $labels.device }} on {{ $labels.host }} failed its SMART health check — replace it
          expr: smartctl_device_smart_status == 0
          for: 5m
          labels:
            severity: critical
        - alert: SmartDeviceHot
          annotations:
            summary: Disk {{ $labels.device }} on {{ $labels.host }} is at {{ $value }}°C
          expr: smartctl_device_temperature{temperature_type="current"} > 55
          for: 30m
          labels:
            severity: warning
    - name: ingress
      rules:
        - alert: IngressBackendUnavailable
          annotations:
            summary: Router {{ $labels.router }} is answering {{ $value | humanizePercentage }} of requests with 502/503/504 — backend down or timing out
          expr: |-
            sum by (router) (rate(traefik_router_requests_total{code=~"502|503|504"}[5m]))
              / (sum by (router) (rate(traefik_router_requests_total[5m])) > 0.05) > 0.1
          for: 15m
          labels:
            severity: warning
    - name: seaweedfs
      rules:
        - alert: SeaweedFsDown
          annotations:
            summary: SeaweedFS on {{ $labels.host }} is not answering metrics scrapes — S3 is likely down
          expr: up{instance=~".+:9327"} == 0
          for: 5m
          labels:
            severity: critical
        - alert: SeaweedFsS3Errors
          annotations:
            summary: "{{ $value | humanizePercentage }} of S3 requests to SeaweedFS are failing server-side"
          expr: sum(rate(SeaweedFS_s3_request_total{code=~"5.."}[5m])) / sum(rate(SeaweedFS_s3_request_total[5m])) > 0.05
          for: 15m
          labels:
            severity: warning
        - alert: SeaweedFsBucketReadOnly
          annotations:
            summary: S3 bucket {{ $labels.bucket }} went read-only after hitting its quota — writes to it fail
          expr: SeaweedFS_s3_bucket_read_only == 1
          for: 5m
          labels:
            severity: critical
    - name: restic
      rules:
        - alert: ResticBackupStale
          annotations:
            summary: No restic snapshot of m1 tank in over 36h
          expr: time() - restic_latest_snapshot_time_seconds > 36 * 3600 or absent(restic_latest_snapshot_time_seconds)
          for: 1h
          labels:
            severity: critical
    - name: attic
      rules:
        - alert: AtticdDown
          annotations:
            summary: atticd on m1 is not active — m1 builds fail at the push hook and hosts fall back to building
          expr: node_systemd_unit_state{host="m1",name="atticd.service",state="active"} == 0
          for: 5m
          labels:
            severity: warning
        - alert: AtticMetricsStale
          annotations:
            summary: attic cache metrics on m1 have not refreshed in over 30m — attic-metrics.service is failing
          expr: time() - node_textfile_mtime_seconds{host="m1",file=~".*/attic.prom"} > 1800 or absent(attic_objects)
          for: 15m
          labels:
            severity: warning
        - alert: AtticSystemPushed
          annotations:
            summary: NixOS system for {{ $labels.machine }} pushed to {{ $labels.cache }}
          expr: time() - attic_system_last_push_time_seconds < 900
          labels:
            severity: none
