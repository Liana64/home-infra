---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: miscellaneous-rules
spec:
  groups:
    - name: zfs
      rules:
        - alert: ZfsPoolUnhealthy
          annotations:
            summary: ZFS pool {{ $labels.pool }} on {{ $labels.host }} is unhealthy (state {{ $value }}, 1=degraded 2=faulted 3=offline 4=unavail 5=removed 6=suspended)
          expr: zfs_pool_health > 0
          for: 5m
          labels:
            severity: critical
        - alert: ZfsExporterAbsent
          annotations:
            summary: zfs_pool_health has no series — m1 zfs exporter down or scrape unwired
          expr: absent(zfs_pool_health)
          for: 6h
          labels:
            severity: warning
        - alert: ZfsSnapshotStale
          annotations:
            summary: Newest snapshot of {{ $labels.dataset }} is {{ $value | humanizeDuration }} old — sanoid autosnap stalled
          expr: time() - zfs_snapshot_latest_time_seconds{dataset!~"tank/backups(/.*)?|tank/users/stash/shared/landfill"} > 3 * 3600
          for: 30m
          labels:
            severity: warning
        - alert: ZfsVolsyncSnapshotStale
          annotations:
            summary: Newest volsync repo snapshot is {{ $value | humanizeDuration }} old — daily sanoid snap missed
          expr: time() - zfs_snapshot_latest_time_seconds{dataset="tank/backups/volsync"} > 26 * 3600
          for: 1h
          labels:
            severity: warning
        - alert: ZfsSnapshotMetricsAbsent
          annotations:
            summary: zfs_snapshot_latest_time_seconds has no series — zfs-snapshot-metrics timer on m1 dead
          expr: absent(zfs_snapshot_latest_time_seconds)
          for: 6h
          labels:
            severity: warning
        - alert: ZfsPoolFilling
          annotations:
            summary: ZFS pool {{ $labels.pool }} on {{ $labels.host }} is down to {{ $value | humanizePercentage }} free on disk — ZFS slows down past 80% full
          expr: zfs_pool_free_bytes / zfs_pool_size_bytes < 0.2 >= 0.1
          for: 1h
          labels:
            severity: warning
        - alert: ZfsPoolFull
          annotations:
            summary: ZFS pool {{ $labels.pool }} on {{ $labels.host }} is down to {{ $value | humanizePercentage }} free on disk — writes fail when it fills
          expr: zfs_pool_free_bytes / zfs_pool_size_bytes < 0.1
          for: 15m
          labels:
            severity: critical
        - alert: ZfsQuotaFilling
          annotations:
            summary: ZFS dataset {{ $labels.name }} on {{ $labels.host }} is at {{ $value | humanizePercentage }} of its quota — raise it in storage.nix or prune
          expr: ((zfs_dataset_used_bytes / (zfs_dataset_quota_bytes > 0)) or (zfs_dataset_referenced_bytes / (zfs_dataset_referenced_quota_bytes > 0))) > 0.9 <= 0.98
          for: 1h
          labels:
            severity: warning
        - alert: ZfsQuotaFull
          annotations:
            summary: ZFS dataset {{ $labels.name }} on {{ $labels.host }} is at {{ $value | humanizePercentage }} of its quota — writes to it fail when it fills
          expr: ((zfs_dataset_used_bytes / (zfs_dataset_quota_bytes > 0)) or (zfs_dataset_referenced_bytes / (zfs_dataset_referenced_quota_bytes > 0))) > 0.98
          for: 15m
          labels:
            severity: critical
    - name: seaweedfs
      rules:
        - alert: SeaweedFsDown
          annotations:
            summary: SeaweedFS on {{ $labels.host }} is not answering metrics scrapes — S3 is likely down
          expr: up{instance=~".+:9327"} == 0
          for: 5m
          labels:
            severity: critical
        - alert: SeaweedFsS3Errors
          annotations:
            summary: "{{ $value | humanizePercentage }} of S3 requests to SeaweedFS are failing server-side"
          expr: sum(rate(SeaweedFS_s3_request_total{code=~"5.."}[5m])) / sum(rate(SeaweedFS_s3_request_total[5m])) > 0.05
          for: 15m
          labels:
            severity: warning
        - alert: SeaweedFsBucketReadOnly
          annotations:
            summary: S3 bucket {{ $labels.bucket }} went read-only after hitting its quota — writes to it fail
          expr: SeaweedFS_s3_bucket_read_only == 1
          for: 5m
          labels:
            severity: critical
    - name: dockerhub
      rules:
        - alert: BootstrapRateLimitRisk
          annotations:
            summary: Kubernetes cluster at risk of being rate limited by dockerhub on bootstrap
          expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
          for: 15m
          labels:
            severity: critical
    - name: oom
      rules:
        - alert: OOMKilled
          annotations:
            summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
          expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
          labels:
            severity: critical
