---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: miscellaneous-rules
spec:
  groups:
    - name: zfs
      rules:
        - alert: ZfsPoolUnhealthy
          annotations:
            summary: ZFS pool {{ $labels.pool }} on {{ $labels.host }} is unhealthy (state {{ $value }}, 1=degraded 2=faulted 3=offline 4=unavail 5=removed 6=suspended)
          expr: zfs_pool_health > 0
          for: 5m
          labels:
            severity: critical
        - alert: ZfsExporterAbsent
          annotations:
            summary: zfs_pool_health has no series — m1 zfs exporter down or scrape unwired
          expr: absent(zfs_pool_health)
          for: 6h
          labels:
            severity: warning
        - alert: ZfsSnapshotStale
          annotations:
            summary: Newest snapshot of {{ $labels.dataset }} is {{ $value | humanizeDuration }} old — sanoid autosnap stalled
          expr: time() - zfs_snapshot_latest_time_seconds{dataset!~"tank/backups(/.*)?|tank/home/shared/landfill"} > 3 * 3600
          for: 30m
          labels:
            severity: warning
        - alert: ZfsVolsyncSnapshotStale
          annotations:
            summary: Newest volsync repo snapshot is {{ $value | humanizeDuration }} old — daily sanoid snap missed
          expr: time() - zfs_snapshot_latest_time_seconds{dataset="tank/backups/volsync"} > 26 * 3600
          for: 1h
          labels:
            severity: warning
        - alert: ZfsSnapshotMetricsAbsent
          annotations:
            summary: zfs_snapshot_latest_time_seconds has no series — zfs-snapshot-metrics timer on m1 dead
          expr: absent(zfs_snapshot_latest_time_seconds)
          for: 6h
          labels:
            severity: warning
    - name: dockerhub
      rules:
        - alert: BootstrapRateLimitRisk
          annotations:
            summary: Kubernetes cluster at risk of being rate limited by dockerhub on bootstrap
          expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
          for: 15m
          labels:
            severity: critical
    - name: oom
      rules:
        - alert: OOMKilled
          annotations:
            summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
          expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
          labels:
            severity: critical
