---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security-rules
spec:
  groups:
    - name: security
      rules:
        - alert: IngressRateLimited
          annotations:
            summary: Router {{ $labels.router }} is returning {{ $value | humanize }} 429/s, rate limit triggered
          expr: sum by (router) (rate(traefik_router_requests_total{code="429"}[5m])) > 1
          for: 15m
          labels:
            severity: warning
        - alert: IngressAuthFailureSpike
          annotations:
            summary: Router {{ $labels.router }} is returning {{ $value | humanize }} 401/403 per second
          expr: sum by (router) (rate(traefik_router_requests_total{code=~"401|403"}[5m])) > 1
          for: 10m
          labels:
            severity: warning
        - alert: AnubisChallengeSpike
          annotations:
            summary: Anubis pod {{ $labels.pod }} is issuing {{ $value | humanize }} challenges/s
          expr: sum by (pod) (rate(anubis_challenges_issued[5m])) > 5
          for: 10m
          labels:
            severity: warning
        - alert: NetworkPolicyDropSpike
          annotations:
            summary: Cilium is dropping {{ $value | humanize }} flows/s from {{ $labels.source_namespace }} to {{ $labels.destination_namespace }} by policy
          expr: sum by (source_namespace, destination_namespace) (rate(hubble_drop_total{reason="POLICY_DENIED"}[5m])) > 1
          for: 10m
          labels:
            severity: warning
        - alert: UnmanagedPodRunning
          annotations:
            summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} has no owning controller and has been running for 15 minutes
          expr: kube_pod_info{created_by_kind="",namespace!="kube-system"} and on (namespace, pod) kube_pod_status_phase{phase="Running"} == 1
          for: 15m
          labels:
            severity: warning
