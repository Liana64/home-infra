          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "pluginVersion": "12.4.2",
          "targets": [
            {
              "editorMode": "code",
              "expr": "min(node_zfs_zpool_state{instance=~\"$instance\",zpool=~\"$zpool\",state=\"online\"})",
