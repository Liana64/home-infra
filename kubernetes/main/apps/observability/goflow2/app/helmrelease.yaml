---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app goflow2
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      goflow2:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
        containers:
          app:
            # renovate: datasource=docker depName=ghcr.io/liana64/goflow2
            image:
              repository: ghcr.io/liana64/goflow2
              tag: 2.2.7@sha256:ecc488b61a6531d770ace25722228be51c2c42f234b488876b12507af5b2247a
            args:
              - -listen=netflow://:2055
              - -addr=:8080
              - -mapping=/config/mapping.yaml
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /__health
                    port: 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    persistence:
      config:
        type: configMap
        name: goflow2-configmap
        globalMounts:
          - path: /config
            readOnly: true
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "${LB_GOFLOW2}"
        externalTrafficPolicy: Local
        ports:
          netflow:
            port: 2055
            protocol: UDP
