---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./networkpolicy.yaml
  - ./helmrelease.yaml
  - ./dashboard.yaml
configMapGenerator:
  - name: goflow2-configmap
    files:
      - mapping.yaml=./resources/mapping.yaml
generatorOptions:
  disableNameSuffixHash: true
