---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pinepods
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      pinepods:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
        containers:
          app:
            # renovate: datasource=docker depName=madeofpendletonwool/pinepods
            image:
              repository: madeofpendletonwool/pinepods
              tag: 0.9.0@sha256:782a1cb78600959d8a0a5cdfd95f9191637a978686e273d0e97ad281ea1dc78f
            env:
              TZ: "${TIMEZONE}"
              HOSTNAME: "https://podcasts.${ORG_DOMAIN}"
              SEARCH_API_URL: "https://search.pinepods.online/api/search"
              PEOPLE_API_URL: "https://people.pinepods.online"
              DB_TYPE: postgresql
              DB_HOST: postgres-1-rw.database.svc.cluster.local
              DB_PORT: "5432"
              DB_NAME: pinepods
              DB_USER: pinepods
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: pinepods-db-secret
                    key: DB_PASSWORD
              VALKEY_HOST: 127.0.0.1
              VALKEY_PORT: &valkeyPort "6379"
              DEBUG_MODE: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/pinepods_check
                    port: &port 8040
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/pinepods_check
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 25m
              limits:
                memory: 1Gi
          valkey:
            # renovate: datasource=docker depName=valkey/valkey
            image:
              repository: valkey/valkey
              tag: 9-alpine@sha256:3b83b0b6a598bb390c8186a408a69949772f439548a81c5ea0ab7ccf102c248d
            args:
              - --bind
              - 127.0.0.1
              - --port
              - *valkeyPort
              - --save
              - ""
              - --appendonly
              - "no"
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 128Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 911
        runAsGroup: 911
        fsGroup: 911
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [2000]
        seccompProfile: {type: RuntimeDefault}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["m1"]
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    ingress:
      app:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-production"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: "networking-traefik-middleware-chain-media@kubernetescrd"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: Pinepods
          gethomepage.dev/description: Podcasts
          gethomepage.dev/icon: pinepods
        hosts:
          - host: &host "podcasts.${ORG_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: pinepods-tls
            hosts: [*host]
    persistence:
      data:
        storageClass: cluster-nvme
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true
        advancedMounts:
          pinepods:
            app:
              - path: /opt/pinepods
      media:
        existingClaim: media
        advancedMounts:
          pinepods:
            app:
              - path: /opt/pinepods/downloads
                subPath: Podcasts
      scratch:
        type: emptyDir
        advancedMounts:
          pinepods:
            app:
              - {path: /etc/horust/services, subPath: horust}
              - {path: /pinepods/cache, subPath: cache}
              - {path: /var/log/pinepods, subPath: log-pinepods}
              - {path: /var/log/nginx, subPath: log-nginx}
              - {path: /var/lib/nginx, subPath: nginx}
              - {path: /var/lib/nginx/logs, subPath: log-nginx}
              - {path: /run, subPath: run}
              - {path: /tmp, subPath: tmp}
      valkey-data:
        type: emptyDir
        advancedMounts:
          pinepods:
            valkey:
              - path: /data
