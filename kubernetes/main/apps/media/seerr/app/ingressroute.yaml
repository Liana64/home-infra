---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seerr-auth
spec:
  ingressClassName: traefik-external
  entryPoints:
    - websecure
  routes:
    - match: Host(`requests.${PERSONAL_DOMAIN}`) && PathRegexp(`(?i)^/api/v1/auth/(jellyfin|local|reset-password)`)
      middlewares:
        - name: traefik-middleware-ratelimit-auth
          namespace: networking
        - name: traefik-middleware-chain-no-auth-anubis
          namespace: networking
      services:
        - name: seerr
          port: 5055
  tls:
    secretName: jellyseerr-requests-tls
