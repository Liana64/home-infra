---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      seerr:
        strategy: Recreate
        pod:
          terminationGracePeriodSeconds: 60
        containers:
          app:
            # renovate: datasource=docker depName=ghcr.io/seerr-team/seerr
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.5.1@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
            command: ["/landlock/landrun"]
            # landrun scrubs the environment: every env key must be listed in --env
            args:
              - --best-effort
              - --log-level=info
              - --rox=/usr,/lib,/bin
              - --ro=/app,/etc,/proc,/sys/fs/cgroup
              - --rw=/app/config,/tmp,/app/.next/cache
              - --bind-tcp=5055
              - --connect-tcp=443,5055,7878,8096,8989,53
              - --env=PATH,HOME=/tmp,NODE_ENV,COMMIT_TAG,TZ,PORT,forceIpv4First
              - --
              - npm
              - start
            env:
              TZ: ${TIMEZONE}
              PORT: &port 5055
              forceIpv4First: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 250Mi
              limits:
                memory: 512Mi

      prune-cache:
        type: cronjob
        cronjob:
          schedule: "@weekly"
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 0
          failedJobsHistory: 1
        pod:
          restartPolicy: Never
        containers:
          app:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command:
              - /bin/sh
              - -c
              - >-
                find /app/config/cache/images -type f -mtime +30 -delete;
                find /app/config/cache/images -mindepth 1 -type d -empty -delete
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - "m1"
    service:
      app:
        controller: seerr
        ports:
          http:
            port: *port

    ingress:
      app:
        className: traefik-external
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-production"
          external-dns.alpha.kubernetes.io/target: "external.${PERSONAL_DOMAIN}"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: "networking-traefik-middleware-ratelimit-streaming@kubernetescrd,networking-traefik-middleware-chain-no-auth-anubis@kubernetescrd"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: seerr
          gethomepage.dev/description: Media requests
          gethomepage.dev/icon: seerr
          #gethomepage.dev/widget.type: "seerr"
          #gethomepage.dev/widget.key: "${HOMEPAGE_VAR_JELLYSEERR_API_KEY}"
          #gethomepage.dev/widget.url: &host "requests.${PERSONAL_DOMAIN}"
        hosts:
          - host: &host "requests.${PERSONAL_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: jellyseerr-requests-tls
            hosts: [*host]

      # Route seerr assets without anubis
      assets:
        className: traefik-external
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: "networking-traefik-middleware-ratelimit-streaming@kubernetescrd,networking-traefik-middleware-chain-no-auth@kubernetescrd"
        hosts:
          - host: *host
            paths:
              - path: /imageproxy
                pathType: Prefix
                service:
                  identifier: app
                  port: http
              - path: /avatarproxy
                pathType: Prefix
                service:
                  identifier: app
                  port: http
              - path: /_next
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: jellyseerr-requests-tls
            hosts: [*host]

    persistence:
      config:
        storageClass: cluster-nvme
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true
        globalMounts:
          - path: /app/config
      cache:
        storageClass: cluster-nvme
        accessMode: ReadWriteOnce
        size: 512Mi
        globalMounts:
          - path: /app/config/cache
      tmp:
        type: emptyDir
        advancedMounts:
          seerr:
            app:
              - path: /app/config/logs
                subPath: logs
              - path: /tmp
                subPath: tmp
              - path: /app/.next/cache
                subPath: next-cache
      landlock:
        type: image
        # renovate: datasource=docker depName=ghcr.io/liana64/landrun
        image: ghcr.io/liana64/landrun:0.1.17
        advancedMounts:
          seerr:
            app:
              - path: /landlock
