---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app slskd
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      slskd:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          mkdir:
            image:
              repository: docker.io/library/busybox
              tag: "1.38.0"
            command:
              - /bin/sh
              - -c
              - umask 002 && mkdir -p /media/Downloads/soulseek /media/Downloads/soulseek-incomplete
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vpn","namespace":"kube-system","ips":["172.16.140.10/24"]}]'
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
            # 2000 = m1 media share gid (tank/cluster/media 2775 root 2000:2000)
            supplementalGroups:
              - 2000
        containers:
          app:
            image:
              repository: ghcr.io/slskd/slskd
              tag: 0.26.1@sha256:588af49abc3088d639c8f1174d3bfad6e92c093a275a593140e3ac9311ebf6c4
            env:
              TZ: "${TIMEZONE}"
              DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp
              SLSKD_UMASK: "002"
              SLSKD_HTTP_PORT: &port 5030
              SLSKD_NO_HTTPS: "true"
              SLSKD_NO_VERSION_CHECK: "true"
              SLSKD_DOWNLOADS_DIR: /media/Downloads/soulseek
              SLSKD_INCOMPLETE_DIR: /media/Downloads/soulseek-incomplete
              SLSKD_SHARED_DIR: /media/Music
              # KiB/s
              SLSKD_UPLOAD_SPEED_LIMIT: 22700
              SLSKD_SLSK_LISTEN_PORT: 50300
            envFrom:
              - secretRef:
                  name: slskd-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1024Mi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - "m1"
    service:
      app:
        controller: slskd
        ports:
          http:
            port: *port
    ingress:
      app:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-production"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: "networking-traefik-middleware-chain-no-auth@kubernetescrd"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: slskd
          gethomepage.dev/description: Soulseek client
          gethomepage.dev/icon: slskd
        hosts:
          - host: &host "slskd.${LAB_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: slskd-tls
            hosts: [*host]
    persistence:
      app:
        storageClass: cluster-nvme
        accessMode: ReadWriteOnce
        size: 2Gi
        retain: true
        advancedMounts:
          slskd:
            app:
              - path: /app
      media:
        existingClaim: media
        advancedMounts:
          slskd:
            mkdir:
              - path: /media
            app:
              - path: /media
      tmp:
        type: emptyDir
        advancedMounts:
          slskd:
            app:
              - path: /tmp
