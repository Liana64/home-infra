---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      qbittorrent:
        annotations:
          configmap.reloader.stakater.com/reload: qbittorrent-dnsdist,natpmp
          secret.reloader.stakater.com/reload: qbittorrent-secret
        initContainers:
          dnsdist:
            image:
              repository: docker.io/powerdns/dnsdist-19
              tag: 1.9.16
            restartPolicy: Always
            securityContext:
              runAsUser: 953
              runAsGroup: 953
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          natpmp:
            image:
              repository: docker.io/library/busybox
              tag: "1.38.0"
            restartPolicy: Always
            command: ["/bin/sh", "/natpmp/natpmp.sh"]
            env:
              NATPMP_SYNC: >-
                wget -qO- localhost:8080/api/v2/app/preferences | grep -q "\"listen_port\":$PORT," ||
                wget -qO- --post-data "json={\"listen_port\":$PORT}" localhost:8080/api/v2/app/setPreferences
            resources:
              requests:
                cpu: 5m
                memory: 8Mi
              limits:
                memory: 32Mi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vpn","namespace":"kube-system","ips":["172.16.140.20/24"]}]'
          dnsPolicy: None
          dnsConfig:
            nameservers:
              - 127.0.0.2
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
            supplementalGroups:
              - 2000
            sysctls:
              - name: net.ipv4.ip_unprivileged_port_start
                value: "53"
          terminationGracePeriodSeconds: 120
        containers:
          app:
            nameOverride: qbittorrent
            # renovate: datasource=docker depName=ghcr.io/liana64/qbittorrent
            image:
              repository: ghcr.io/liana64/qbittorrent
              tag: 5.2.4@sha256:9dbbb13c2acb729a82e2a47cb39a0e9b9f142d94f46af33403a5c0a2cb7c9c55
            env:
              UMASK: "022"
              QBT_WEBUI_PORT: &port 8080
              QBT_BitTorrent__Session__Interface: net1
              QBT_BitTorrent__Session__InterfaceName: net1
              QBT_BitTorrent__Session__DefaultSavePath: "/media/Downloads"
              QBT_BitTorrent__Session__QueueingSystemEnabled: "true"
              QBT_BitTorrent__Session__MaxActiveDownloads: 3
              QBT_BitTorrent__Session__MaxActiveUploads: 50
              QBT_BitTorrent__Session__MaxActiveTorrents: 250
              QBT_BitTorrent__Session__MaxActiveCheckingTorrents: 3
              QBT_BitTorrent__Session__IgnoreSlowTorrentsForQueueing: "true"
              QBT_BitTorrent__Session__MaxConnections: -1
              QBT_BitTorrent__Session__MaxConnectionsPerTorrent: -1
              QBT_BitTorrent__Session__MaxUploads: -1
              QBT_BitTorrent__Session__MaxUploadsPerTorrent: -1
              # KiB/s
              QBT_BitTorrent__Session__GlobalDLSpeedLimit: 52000
              QBT_BitTorrent__Session__GlobalUPSpeedLimit: 23000
              QBT_BitTorrent__Session__AlternativeGlobalDLSpeedLimit: 80000
              QBT_BitTorrent__Session__AlternativeGlobalUPSpeedLimit: 35000
              QBT_BitTorrent__Session__GlobalMaxRatio: 4
              QBT_BitTorrent__Session__ShareLimitAction: Stop
              QBT_BitTorrent__Session__UseRandomPort: "false"
              QBT_Preferences__WebUI__CSRFProtection: "false"
              QBT_Preferences__WebUI__HostHeaderValidation: "false"
              QBT_Preferences__WebUI__LocalHostAuth: "false"
              QBT_Application__MemoryWorkingSetLimit: 3072
              QBT_Preferences__WebUI__Username:
                valueFrom:
                  secretKeyRef:
                    name: qbittorrent-secret
                    key: QBITTORRENT_USER
            envFrom:
              - secretRef:
                  name: qbittorrent-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 150m
                memory: 512Mi
              limits:
                memory: 4096Mi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - "m1"
    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: *port
    ingress:
      app:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-production"
          external-dns.alpha.kubernetes.io/target: "external.${PERSONAL_DOMAIN}"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: "networking-traefik-middleware-chain-no-auth@kubernetescrd"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: qBittorrent
          gethomepage.dev/description: Torrent client
          gethomepage.dev/icon: qbittorrent
        hosts:
          - host: &host "{{ .Release.Name }}.${LAB_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: qbittorrent-tls
            hosts: [*host]
    persistence:
      config:
        storageClass: cluster-nvme
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true
        advancedMounts:
          qbittorrent:
            app:
              - path: /config
      media:
        existingClaim: media
        advancedMounts:
          qbittorrent:
            app:
              - path: /media
      natpmp:
        type: configMap
        name: natpmp
        advancedMounts:
          qbittorrent:
            natpmp:
              - path: /natpmp
                readOnly: true
      dnsdist:
        type: configMap
        name: qbittorrent-dnsdist
        advancedMounts:
          qbittorrent:
            dnsdist:
              - path: /etc/dnsdist/dnsdist.conf
                subPath: dnsdist.conf
                readOnly: true
