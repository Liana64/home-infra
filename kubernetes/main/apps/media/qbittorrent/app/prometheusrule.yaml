---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: qbittorrent
spec:
  groups:
    - name: qbittorrent.rules
      rules:
        - alert: QbittorrentDown
          annotations:
            summary: qBittorrent API is unreachable from the exporter
          expr: qbittorrent_up == 0 or absent(qbittorrent_up)
          for: 15m
          labels:
            severity: warning
        - alert: QbittorrentDisconnected
          annotations:
            summary: qBittorrent has no peer connectivity — gluetun tunnel or forwarded port is down
          expr: qbittorrent_connected == 0 or qbittorrent_firewalled == 1
          for: 30m
          labels:
            severity: warning
