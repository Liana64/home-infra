---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app opengist-org
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: opengist-org-secret
    template:
      engineVersion: v2
      data:
        OG_SECRET_KEY: "{{ .OG_SECRET_KEY }}"
        OG_OIDC_SECRET: "{{ .OG_OIDC_SECRET }}"
        OG_OIDC_CLIENT_KEY: "{{ .OG_OIDC_CLIENT_KEY }}"
  data:
    - secretKey: OG_OIDC_CLIENT_KEY
      remoteRef:
        key: "e25dd90f-4752-478e-957b-b4fc0147d563"
    - secretKey: OG_SECRET_KEY
      remoteRef:
        key: "11ddefc1-2d96-43a7-8ae7-b4fc0146609f"
    - secretKey: OG_OIDC_SECRET
      remoteRef:
        key: "6aa8c229-b19a-4b21-be2b-b4fc0147142c"
