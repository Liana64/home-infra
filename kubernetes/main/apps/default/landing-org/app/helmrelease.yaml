---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app landing-org
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      landing-org:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
        containers:
          app:
            # renovate: datasource=docker depName=nginxinc/nginx-unprivileged
            image:
              repository: docker.io/nginxinc/nginx-unprivileged
              tag: 1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
            command: ["/landlock/landrun"]
            # -e stderr skips the compiled-in error log; reopening /dev/stdout under landlock is denied
            args:
              - --best-effort
              - --log-level=info
              - --rox=/usr,/lib
              - --ro=/etc
              - --rw=/tmp
              - --bind-tcp=8080
              - --env=PATH
              - --
              - /usr/sbin/nginx
              - -e
              - stderr
              - -g
              - daemon off;
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    ingress:
      app:
        className: traefik-external
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-production"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: "networking-traefik-middleware-ratelimit@kubernetescrd,networking-traefik-middleware-chain-no-auth@kubernetescrd"
        hosts:
          - host: &host "${ORG_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: landing-org-tls
            hosts: [*host]
    persistence:
      html:
        type: configMap
        name: landing-org-configmap
        globalMounts:
          - path: /usr/share/nginx/html/index.html
            subPath: index.html
            readOnly: true
          - path: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      landlock:
        type: image
        # renovate: datasource=docker depName=ghcr.io/liana64/landrun
        image: ghcr.io/liana64/landrun:0.1.17@sha256:33620d9d2ed4e858e549642810895a1fb8f0ff3438fcdf35032e04cdfcf197f5
        globalMounts:
          - path: /landlock
