---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meet-db
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: meet-db-secret
    template:
      engineVersion: v2
      data:
        DB_USER: meet
        DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "608ca4b5-aff7-4e27-9305-b4df00f92d8a"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meet-redis
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: meet-redis-secret
    template:
      engineVersion: v2
      data:
        REDIS_URL: "redis://:{{ .password | urlquery }}@dragonfly.database.svc.cluster.local:6379/3"
  data:
    - secretKey: password
      remoteRef:
        key: "77c19173-5f47-47a1-8983-b4e2016dec3e"
