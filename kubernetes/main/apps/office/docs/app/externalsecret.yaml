---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docs-backend
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: docs-backend-secret
    template:
      engineVersion: v2
      data:
        DB_USER: docs
        DB_PASSWORD: "{{ .db_password }}"
        DJANGO_SECRET_KEY: "{{ .django_secret_key }}"
        OIDC_RP_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        Y_PROVIDER_API_KEY: "{{ .y_provider_api_key }}"
        AWS_S3_ACCESS_KEY_ID: "{{ .s3_access_key_id }}"
        AWS_S3_SECRET_ACCESS_KEY: "{{ .s3_secret_access_key }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: "886381c0-bed6-4df1-979b-b4e1017419d2"
    - secretKey: django_secret_key
      remoteRef:
        key: "7279f47c-6124-4160-bcc8-b4e101748eb2"
    - secretKey: oidc_client_secret
      remoteRef:
        key: "112aad10-fa0b-474c-b81d-b4e101763d82"
    - secretKey: y_provider_api_key
      remoteRef:
        key: "3b557e53-8da3-49e9-a19d-b4e101766535"
    - secretKey: s3_access_key_id
      remoteRef:
        key: "39010a37-40eb-40a7-860b-b4e101751b42"
    - secretKey: s3_secret_access_key
      remoteRef:
        key: "aaff0f3b-65d5-4986-bf17-b4e101753957"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docs-yhub
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: docs-yhub-secret
    template:
      engineVersion: v2
      data:
        POSTGRES: "postgres://docs_yhub:{{ .db_password | urlquery }}@postgres-1-rw.database.svc.cluster.local:5432/docs_yhub?sslmode=require"
        Y_PROVIDER_API_KEY: "{{ .y_provider_api_key }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: "1cdc2b25-1e0c-4f7d-8789-b4e101744980"
    - secretKey: y_provider_api_key
      remoteRef:
        key: "3b557e53-8da3-49e9-a19d-b4e101766535"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docs-jwt
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: docs-jwt-secret
  data:
    - secretKey: private.pem
      remoteRef:
        key: "127a9755-ae26-4df8-a557-b4e10174d549"
    - secretKey: yhub-private.pem
      remoteRef:
        key: "3ed66a21-151c-4719-ae45-b4e10174f9f1"
