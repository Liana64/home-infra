---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-middleware-compress
spec:
  compress:
    minResponseBodyBytes: 1024
    includedContentTypes:
      - text/html
      - text/css
      - text/plain
      - text/javascript
      - text/xml
      - text/csv
      - application/javascript
      - application/json
      - application/problem+json
      - application/manifest+json
      - application/xml
      - application/rss+xml
      - application/atom+xml
      - application/wasm
      - image/svg+xml
      - font/ttf
      - font/otf
