---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-middleware-secure-headers
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - OPTIONS
      - PUT
      - POST
    accessControlMaxAge: 100
    accessControlAllowOriginListRegex:
      - '^https://([a-z0-9-]+\.)*${PERSONAL_DOMAIN}$'
      - '^https://([a-z0-9-]+\.)*${LAB_DOMAIN}$'
      - '^https://([a-z0-9-]+\.)*${ORG_DOMAIN}$'
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    contentTypeNosniff: true
    referrerPolicy: "strict-origin-when-cross-origin"
    contentSecurityPolicy: "upgrade-insecure-requests;"
    customResponseHeaders:
      Permissions-Policy: >-
        accelerometer=(),
        camera=(),
        geolocation=(),
        gyroscope=(),
        magnetometer=(),
        microphone=(),
        payment=(),
        usb=()
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Resource-Policy: same-origin
      Cross-Origin-Embedder-Policy: require-corp
      X-Frame-Options: "SAMEORIGIN"
      X-Robots-Tag: "noindex,nofollow,noarchive,nosnippet,notranslate,noimageindex"
      X-Permitted-Cross-Domain-Policies: "none"
      X-Powered-By: ""
      server: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-middleware-secure-headers-hugo
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - OPTIONS
      - PUT
      - POST
    accessControlMaxAge: 100
    accessControlAllowOriginListRegex:
      - '^https://([a-z0-9-]+\.)*${PERSONAL_DOMAIN}$'
      - '^https://([a-z0-9-]+\.)*${ORG_DOMAIN}$'
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    contentTypeNosniff: true
    referrerPolicy: "strict-origin-when-cross-origin"
    contentSecurityPolicy: >-
      default-src 'none';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self';
      font-src 'self';
      form-action 'none';
      frame-ancestors 'none';
      base-uri 'self';
      upgrade-insecure-requests
    customResponseHeaders:
      Permissions-Policy: >-
        accelerometer=(),
        camera=(),
        geolocation=(),
        gyroscope=(),
        magnetometer=(),
        microphone=(),
        payment=(),
        usb=()
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Resource-Policy: same-origin
      Cross-Origin-Embedder-Policy: require-corp
      X-Frame-Options: "DENY"
      X-Robots-Tag: "index, follow"
      X-Permitted-Cross-Domain-Policies: "none"
      X-Powered-By: ""
      server: ""
