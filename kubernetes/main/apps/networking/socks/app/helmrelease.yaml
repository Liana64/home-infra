---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app socks
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      socks:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
        initContainers:
          dnsdist:
            image:
              repository: docker.io/powerdns/dnsdist-19
              tag: 1.9.16@sha256:260b1120947a10c494fad4d93cde33ebace34bf4800c88ebb114dd7f9e829809
            restartPolicy: Always
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 64Mi
            securityContext:
              runAsUser: 953
              runAsGroup: 953
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: docker.io/serjs/go-socks5-proxy
              tag: v0.0.4@sha256:6828ddb2a6a93dec85209b69cd3842bd80094f7dd52f35ee1dd0f9e9165e2188
            env:
              PROXY_LISTEN_IP: 172.16.140.30
              PROXY_PORT: "1080"
              REQUIRE_AUTH: "false"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"vpn","namespace":"kube-system","ips":["172.16.140.30/24"]}]'
          dnsPolicy: None
          dnsConfig:
            nameservers:
              - 127.0.0.2
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "53"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - "m1"
    persistence:
      dnsdist:
        type: configMap
        name: socks-dnsdist
        advancedMounts:
          socks:
            dnsdist:
              - path: /etc/dnsdist/dnsdist.conf
                subPath: dnsdist.conf
                readOnly: true
