---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app continuwuity-personal
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      continuwuity-personal:
        # RocksDB is a single writer
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # renovate: datasource=docker depName=forgejo.ellis.link/continuwuation/continuwuity
            image:
              repository: forgejo.ellis.link/continuwuation/continuwuity
              tag: v26.8.1@sha256:fdf3cd0ffec66dbbce3c7e58999739355dd0c630b068bb02929a19719448d585
            env:
              TZ: "${TIMEZONE}"
              TOKIO_WORKER_THREADS: "2"
              CONTINUWUITY_SERVER_NAME: "${PERSONAL_DOMAIN}"
              CONTINUWUITY_ADDRESS: "0.0.0.0"
              CONTINUWUITY_PORT: "8008"
              CONTINUWUITY_DATABASE_PATH: /data/db
              CONTINUWUITY_DB_CACHE_CAPACITY_MB: "512"
              CONTINUWUITY_ROCKSDB_PARALLELISM_THREADS: "2"
              CONTINUWUITY_MAX_REQUEST_SIZE: "20000000"
              CONTINUWUITY_ALLOW_FEDERATION: "true"
              CONTINUWUITY_TRUSTED_SERVERS: '["matrix.org"]'
              CONTINUWUITY_ALLOW_CHECK_FOR_UPDATES: "false"
              CONTINUWUITY_ALLOW_REGISTRATION: "false"
              CONTINUWUITY_WELL_KNOWN__SERVER: "matrix.${PERSONAL_DOMAIN}:443"
              CONTINUWUITY_WELL_KNOWN__CLIENT: "https://matrix.${PERSONAL_DOMAIN}"
              CONTINUWUITY_WELL_KNOWN__SUPPORT_EMAIL: "liana@${PERSONAL_DOMAIN}"
              CONTINUWUITY_LOG: info
            envFrom:
              - secretRef:
                  name: continuwuity-personal-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /_matrix/client/versions
                    port: 8008
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /_matrix/client/versions
                    port: 8008
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      # RocksDB needs to flush and close cleanly
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: *app
        ports:
          http:
            port: 8008

    ingress:
      # /login and /register are the only unauthenticated surface: keep internal
      app:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-production"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: "networking-traefik-middleware-chain-matrix@kubernetescrd"
        hosts:
          - host: &host "matrix.${PERSONAL_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: continuwuity-personal-tls
            hosts: [*host]
      # /_matrix/media is deliberately absent: authenticated media moved under
      # /_matrix/federation/v1/media in spec v1.11
      federation:
        className: traefik-external
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-production"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: "networking-traefik-middleware-ratelimit-streaming@kubernetescrd,networking-traefik-middleware-chain-matrix@kubernetescrd"
        hosts:
          - host: *host
            paths:
              - path: /_matrix/federation
                service:
                  identifier: app
                  port: http
              - path: /_matrix/key
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: continuwuity-personal-federation-tls
            hosts: [*host]
      # delegation for the apex server_name; the blog serves / on this host
      wellknown:
        className: traefik-external
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-production"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: "networking-traefik-middleware-ratelimit-streaming@kubernetescrd,networking-traefik-middleware-chain-matrix@kubernetescrd"
        hosts:
          - host: &apexHost "${PERSONAL_DOMAIN}"
            paths:
              - path: /.well-known/matrix
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: continuwuity-personal-wellknown-tls
            hosts: [*apexHost]

    persistence:
      data:
        storageClass: cluster-nvme
        accessMode: ReadWriteOnce
        size: 100Gi
        retain: true
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
