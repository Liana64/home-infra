---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app anubis
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      anubis:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/techarohq/anubis
              tag: v1.28.2@sha256:5fcbce70ee6168be5b226d19bec90111d0acd0daf13028fa06b044cf3ebbbd5f
            command: &command ["/landlock/landrun"]
            # landrun scrubs the environment: every env and secret key must be listed in --env
            args: &args
              - --best-effort
              - --log-level=info
              - --rox=/ko-app
              - --ro=/etc,/config,/var/run/ko,/proc,/sys/fs/cgroup
              - --bind-tcp=8080,9090
              - --connect-tcp=53
              - --env=BIND,METRICS_BIND,TZ,COOKIE_DOMAIN,PUBLIC_URL,REDIRECT_DOMAINS,SERVE_ROBOTS_TXT,POLICY_FNAME,TARGET,ED25519_PRIVATE_KEY_HEX,SSL_CERT_FILE,KO_DATA_PATH
              - --
              - /ko-app/anubis
            env:
              BIND: ":8080"
              METRICS_BIND: ":9090"
              TZ: ${TIMEZONE}
              COOKIE_DOMAIN: ${PERSONAL_DOMAIN}
              PUBLIC_URL: https://anubis.${PERSONAL_DOMAIN}
              REDIRECT_DOMAINS: "*.${PERSONAL_DOMAIN},${PERSONAL_DOMAIN}"
              SERVE_ROBOTS_TXT: true
              POLICY_FNAME: /config/botPolicies.yaml
              TARGET: " "
            envFrom:
              - secretRef:
                  name: anubis-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

      # Pass cookies bind to one registrable domain; ORG_DOMAIN needs its own instance.
      org:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/techarohq/anubis
              tag: v1.28.2@sha256:5fcbce70ee6168be5b226d19bec90111d0acd0daf13028fa06b044cf3ebbbd5f
            command: *command
            args: *args
            env:
              BIND: ":8080"
              METRICS_BIND: ":9090"
              TZ: ${TIMEZONE}
              COOKIE_DOMAIN: ${ORG_DOMAIN}
              PUBLIC_URL: https://anubis.${ORG_DOMAIN}
              REDIRECT_DOMAINS: "*.${ORG_DOMAIN},${ORG_DOMAIN}"
              SERVE_ROBOTS_TXT: true
              POLICY_FNAME: /config/botPolicies.yaml
              TARGET: " "
            envFrom:
              - secretRef:
                  name: anubis-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        controller: anubis
        ports:
          http:
            port: &port 8080
          metrics:
            port: &metrics 9090
      org:
        controller: org
        ports:
          http:
            port: *port
          metrics:
            port: *metrics
    serviceMonitor:
      app:
        service:
          identifier: app
        endpoints: &endpoints
          - port: metrics
            interval: 30s
      org:
        service:
          identifier: org
        endpoints: *endpoints
    ingress:
      app:
        className: traefik-external
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-production"
          external-dns.alpha.kubernetes.io/target: "external.${PERSONAL_DOMAIN}"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: "networking-traefik-middleware-ratelimit@kubernetescrd,networking-traefik-middleware-chain-no-auth@kubernetescrd"
        hosts:
          - host: &host "anubis.${PERSONAL_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
            secretName: "anubis-production-tls"
      org:
        className: traefik-external
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-production"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: "networking-traefik-middleware-ratelimit@kubernetescrd,networking-traefik-middleware-chain-no-auth@kubernetescrd"
        hosts:
          - host: &orgHost "anubis.${ORG_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: org
                  port: http
        tls:
          - hosts:
              - *orgHost
            secretName: "anubis-org-tls"
    persistence:
      bot-policy:
        type: configMap
        name: anubis-bot-policy
        globalMounts:
          - path: /config/botPolicies.yaml
            subPath: botPolicies.yaml
            readOnly: true
      landlock:
        type: image
        # renovate: datasource=docker depName=ghcr.io/liana64/landrun
        image: ghcr.io/liana64/landrun:0.1.17
        globalMounts:
          - path: /landlock
