---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app crowdsec
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      lapi:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # renovate: datasource=docker depName=ghcr.io/liana64/crowdsec
            image: &image
              repository: ghcr.io/liana64/crowdsec
              tag: 1.8.2@sha256:1c19be53b13ceee950c76a1a285eb3c45000ee5fe2b302d5ae0068ecbe3dae3f
            args: ["lapi"]
            env:
              TZ: "${TIMEZONE}"
            envFrom:
              - secretRef:
                  name: crowdsec-secret
            probes:
              liveness: &lapiProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &lapiPort 8080
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *lapiProbes
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 20m
              limits:
                memory: 256Mi
      agent:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: *image
            args: ["agent"]
            env:
              TZ: "${TIMEZONE}"
              LAPI_URL: http://crowdsec-lapi.security.svc.cluster.local:8080
              AGENT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: crowdsec-secret
                    key: AGENT_PASSWORD
            probes:
              liveness: &agentProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: &metricsPort 6060
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *agentProbes
            securityContext: *securityContext
            resources:
              requests:
                cpu: 20m
              limits:
                memory: 256Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      lapi:
        controller: lapi
        ports:
          http:
            port: *lapiPort
          metrics:
            port: *metricsPort
      agent:
        controller: agent
        ports:
          metrics:
            port: *metricsPort
    serviceMonitor:
      lapi:
        serviceName: crowdsec-lapi
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
      agent:
        serviceName: crowdsec-agent
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
    persistence:
      db:
        storageClass: cluster-nvme
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          lapi:
            app:
              - path: /var/lib/crowdsec/db
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      acquis:
        type: configMap
        name: crowdsec-acquis
        advancedMounts:
          agent:
            app:
              - path: /etc/crowdsec/acquis.yaml
                subPath: acquis.yaml
                readOnly: true
