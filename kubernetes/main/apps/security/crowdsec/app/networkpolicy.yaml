---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-lapi
  namespace: security
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: crowdsec
      app.kubernetes.io/controller: lapi
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: crowdsec
            app.kubernetes.io/controller: agent
        - matchLabels:
            io.kubernetes.pod.namespace: networking
            app.kubernetes.io/instance: traefik-external-networking
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-agent
  namespace: security
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: crowdsec
      app.kubernetes.io/controller: agent
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: crowdsec
            app.kubernetes.io/controller: lapi
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: loki
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: crowdsec
            app.kubernetes.io/controller: lapi
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
