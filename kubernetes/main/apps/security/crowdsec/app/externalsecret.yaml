---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: crowdsec-secret
    template:
      data:
        AGENT_PASSWORD: "{{ .CROWDSEC_AGENT_PASSWORD }}"
        BOUNCER_KEY: "{{ .CROWDSEC_BOUNCER_KEY }}"
  data:
    - secretKey: CROWDSEC_AGENT_PASSWORD
      remoteRef:
        key: "6d9c5da6-3335-49a2-9931-b4f30181ebc7"
    - secretKey: CROWDSEC_BOUNCER_KEY
      remoteRef:
        key: "fc331f04-166e-4397-8283-b4f30182186e"
