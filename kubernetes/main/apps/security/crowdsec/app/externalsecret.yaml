---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: crowdsec-secret
    template:
      data:
        AGENT_PASSWORD: "{{ .CROWDSEC_AGENT_PASSWORD }}"
        BOUNCER_KEY: "{{ .CROWDSEC_BOUNCER_KEY }}"
        CAPI_LOGIN: "{{ .CROWDSEC_CAPI_LOGIN }}"
        CAPI_PASSWORD: "{{ .CROWDSEC_CAPI_PASSWORD }}"
  data:
    - secretKey: CROWDSEC_AGENT_PASSWORD
      remoteRef:
        key: "6d9c5da6-3335-49a2-9931-b4f30181ebc7"
    - secretKey: CROWDSEC_BOUNCER_KEY
      remoteRef:
        key: "fc331f04-166e-4397-8283-b4f30182186e"
    - secretKey: CROWDSEC_CAPI_LOGIN
      remoteRef:
        key: "9b404588-a032-4d95-9a91-b4fb00ff91df"
    - secretKey: CROWDSEC_CAPI_PASSWORD
      remoteRef:
        key: "4fc343bc-0a92-44ce-9340-b4fb00ffb673"
