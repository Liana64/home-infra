---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkding-oidc
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: linkding-oidc-secret
    template:
      engineVersion: v2
      data:
        OIDC_RP_CLIENT_SECRET: "{{ .OAUTH_CLIENT_LINKDING }}"
  data:
    - secretKey: OAUTH_CLIENT_LINKDING
      remoteRef:
        key: "624a05ca-363b-4cbc-ac68-b48500f94f0c"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkding-db
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: linkding-db-secret
    template:
      engineVersion: v2
      data:
        LD_DB_USER: linkding
        LD_DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "66282c8d-33c0-4e39-984f-b4df00f6ff0e"
