---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: home-immich-photos
spec:
  capacity:
    storage: 1Ti
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: home
    name: immich-photos
  nfs:
    server: ${M1_HOST}
    path: /tank/cluster/photos
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-photos
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Ti
  storageClassName: ""
  volumeName: home-immich-photos
