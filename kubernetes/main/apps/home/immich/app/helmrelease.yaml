---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["m1"]

    controllers:
      immich:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: immich-secret,immich-db-secret
          configmap.reloader.stakater.com/reload: immich-configmap
        defaultContainerOptions: &containerOptions
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.1@sha256:db996e352359771c6a3db121a0ed8761516b22f727fc092a0f46dcfef82c1bc1
            envFrom:
              - secretRef:
                  name: &secret immich-secret
              - secretRef:
                  name: immich-db-secret
              - configMapRef:
                  name: immich-configmap
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi

      machine-learning:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: immich-secret
          configmap.reloader.stakater.com/reload: immich-configmap
        defaultContainerOptions: *containerOptions
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-machine-learning
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.3.1@sha256:513c831cfb010ad319341a0c86b42c575a0d5b688d3e8cae346ee624074a58ed
            envFrom:
              - secretRef:
                  name: *secret
              - configMapRef:
                  name: immich-configmap
            env:
              MPLCONFIGDIR: /cache/matplotlib
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi

    service:
      immich:
        controller: immich
        ports:
          http:
            port: &port 2283
          metrics-api:
            port: 8081
          metrics-ms:
            port: 8082
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: 3003

    serviceMonitor:
      immich:
        serviceName: immich
        endpoints:
          - port: metrics-api
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
          - port: metrics-ms
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s

    ingress:
      immich:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Immich
          gethomepage.dev/description: Photo management
          gethomepage.dev/icon: immich
        hosts:
          - host: &host "immich.${ORG_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: immich
                  port: *port
        tls:
          - secretName: immich-tls
            hosts: [*host]

    persistence:
      data:
        existingClaim: immich-photos
        advancedMounts:
          immich:
            main:
              - path: /library
      machine-learning-cache:
        storageClass: cluster-nvme
        accessMode: ReadWriteOnce
        size: 8Gi
        advancedMounts:
          machine-learning:
            main:
              - path: /cache
                subPath: cache
              - path: /.cache
                subPath: dotCache
      matplotlib:
        type: emptyDir
        advancedMounts:
          machine-learning:
            main:
              - path: /cache/matplotlib
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      tmpfs:
        type: emptyDir
        advancedMounts:
          immich:
            main:
              - path: /usr/src/app/.reverse-geocoding-dump
                subPath: geocoding
              - path: /usr/src/app/.transformers_cache
                subPath: transformers
