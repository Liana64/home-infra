---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: host-shells
spec:
  kprobes:
    - call: sys_execve
      syscall: true
      args:
        - index: 0
          type: string
      selectors:
        - matchNamespaces:
            - namespace: Mnt
              operator: In
              values: ["host_ns"]
          matchArgs:
            - index: 0
              operator: Postfix
              values:
                - /sh
                - /ash
                - /bash
                - /dash
                - /zsh
                - /busybox
