---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tetragon
spec:
  interval: 30m
  chart:
    spec:
      chart: tetragon
      version: 1.8.0
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    tetragon:
      clusterName: milberry
      prometheus:
        serviceMonitor:
          enabled: true
      exportDenyList: ""
      exportAllowList: '{"event_set":["PROCESS_KPROBE"]}'
    tetragonOperator:
      prometheus:
        serviceMonitor:
          enabled: true
    crds:
      installMethod: helm
