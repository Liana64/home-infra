---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tetragon
  namespace: flux-system
spec:
  targetNamespace: kube-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/main/apps/kube-system/tetragon/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-infra
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tetragon-policies
  namespace: flux-system
spec:
  targetNamespace: kube-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: tetragon
  path: ./kubernetes/main/apps/kube-system/tetragon/policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-infra
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
