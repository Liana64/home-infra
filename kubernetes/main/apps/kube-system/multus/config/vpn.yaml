---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vpn
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "vpn",
      "plugins": [
        {
          "type": "macvlan",
          "master": "eth1",
          "mode": "bridge",
          "capabilities": { "ips": true },
          "ipam": {
            "type": "static",
            "routes": [
              { "dst": "0.0.0.0/5", "gw": "172.16.140.1" },
              { "dst": "8.0.0.0/7", "gw": "172.16.140.1" },
              { "dst": "11.0.0.0/8", "gw": "172.16.140.1" },
              { "dst": "12.0.0.0/6", "gw": "172.16.140.1" },
              { "dst": "16.0.0.0/4", "gw": "172.16.140.1" },
              { "dst": "32.0.0.0/3", "gw": "172.16.140.1" },
              { "dst": "64.0.0.0/2", "gw": "172.16.140.1" },
              { "dst": "128.0.0.0/3", "gw": "172.16.140.1" },
              { "dst": "160.0.0.0/5", "gw": "172.16.140.1" },
              { "dst": "168.0.0.0/6", "gw": "172.16.140.1" },
              { "dst": "172.0.0.0/12", "gw": "172.16.140.1" },
              { "dst": "172.32.0.0/11", "gw": "172.16.140.1" },
              { "dst": "172.64.0.0/10", "gw": "172.16.140.1" },
              { "dst": "172.128.0.0/9", "gw": "172.16.140.1" },
              { "dst": "173.0.0.0/8", "gw": "172.16.140.1" },
              { "dst": "174.0.0.0/7", "gw": "172.16.140.1" },
              { "dst": "176.0.0.0/4", "gw": "172.16.140.1" },
              { "dst": "192.0.0.0/2", "gw": "172.16.140.1" }
            ]
          }
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv6.conf.net1.disable_ipv6": "1"
          }
        }
      ]
    }
