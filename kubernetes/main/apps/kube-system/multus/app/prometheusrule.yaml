---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: multus
spec:
  groups:
    - name: multus.rules
      rules:
        - alert: MultusAttachmentMissing
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} requested a multus network but has no net1, delete the pod to re-run CNI"
          expr: |
            kube_pod_annotations{annotation_k8s_v1_cni_cncf_io_networks!=""}
              unless on (namespace, pod)
                kube_pod_annotations{annotation_k8s_v1_cni_cncf_io_network_status=~"(?s).*\"interface\": *\"net1\".*"}
              and on (namespace, pod)
                kube_pod_status_phase{phase="Running"} == 1
          for: 5m
          labels:
            severity: warning
