---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./multus-daemonset-thick.yaml
images:
  - name: ghcr.io/k8snetworkplumbingwg/multus-cni
    newTag: v4.3.1-thick
    digest: sha256:a357a79359b80ddd5f4699117946cacf3b54f5baecf7944535594863e875fc25
patches:
  - target:
      kind: ConfigMap
      name: multus-daemon-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: multus-daemon-config
      data:
        daemon-config.json: |
          {
              "chrootDir": "/hostroot",
              "cniVersion": "0.3.1",
              "logLevel": "verbose",
              "logToStderr": true,
              "cniConfigDir": "/host/etc/cni/net.d",
              "multusConfigFile": "/etc/cni/net.d/multus.d/00-multus.conf",
              "socketDir": "/host/run/multus/"
          }
        00-multus.conf: |
          {
              "cniVersion": "0.3.1",
              "logLevel": "verbose",
              "logToStderr": true,
              "name": "multus-cni-network",
              "clusterNetwork": "/host/etc/cni/net.d/05-cilium.conflist",
              "type": "multus-shim"
          }
  - target:
      kind: DaemonSet
      name: kube-multus-ds
    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: kube-multus-ds
        annotations:
          configmap.reloader.stakater.com/reload: multus-daemon-config
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: m1
            initContainers:
              - name: install-cni
                image: ghcr.io/siderolabs/install-cni:v1.9.0@sha256:53bdeb6c8d238dd593ee75f265baf4625925a034d8d18f10ffeae88d7fcf2c3e
                command:
                  - /install-cni.sh
                securityContext:
                  privileged: true
                volumeMounts:
                  - name: cnibin
                    mountPath: /host/opt/cni/bin
                    mountPropagation: Bidirectional
            containers:
              - name: kube-multus
                resources:
                  $patch: replace
                  requests:
                    cpu: 10m
                    memory: 64Mi
            volumes:
              - name: multus-daemon-config
                configMap:
                  name: multus-daemon-config
                  items:
                    - key: daemon-config.json
                      path: daemon-config.json
                    - key: 00-multus.conf
                      path: 00-multus.conf
              - name: host-run-netns
                hostPath:
                  path: /var/run/netns/
