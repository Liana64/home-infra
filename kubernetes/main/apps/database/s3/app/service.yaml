---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: s3-m1
  labels:
    kubernetes.io/service-name: s3
addressType: IPv4
ports:
  - name: s3
    port: 8333
    protocol: TCP
endpoints:
  - addresses: ["${M1_HOST}"]
