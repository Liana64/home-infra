---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-role-docs
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: postgres-role-docs
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: docs
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "886381c0-bed6-4df1-979b-b4e1017419d2"
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: docs
spec:
  name: docs
  owner: docs
  cluster:
    name: postgres-1
  ensure: present
