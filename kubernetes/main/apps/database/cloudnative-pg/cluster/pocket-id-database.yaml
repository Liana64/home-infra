---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-role-pocket-id
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: postgres-role-pocket-id
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: pocket
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "01f2bef3-dd9b-453c-afd8-b4530172496f"
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pocket-id
spec:
  name: pocket-id
  owner: pocket
  cluster:
    name: postgres-1
  ensure: present
