---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-1
spec:
  instances: 2
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:26d15a12723510b0b416e8aec2bc65f2da7ac9b77ef3182a0911e4b8b991420a
  primaryUpdateStrategy: unsupervised
  storage:
    size: 128Gi
    storageClass: cluster-nvme
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  managed:
    roles:
      - name: immich
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-immich
      - name: linkding
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-linkding
      - name: memos
        ensure: absent
      - name: n8n
        ensure: absent
      - name: miniflux
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-miniflux
      - name: atuin
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-atuin
      - name: forgejo
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-forgejo
      - name: pinepods
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-pinepods
      - name: grafana
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-grafana
      - name: meet
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-meet
      - name: lldap_user
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-lldap
      - name: pocket
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-pocket-id
      - name: docs
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-docs
      - name: docs_yhub
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-docs-yhub
      - name: fluxer
        ensure: absent
  postgresql:
    extensions:
      - name: vector
        image:
          # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/pgvector
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-18-trixie@sha256:36dd07720447813c0659c6d8a961e1bc79a4324c6d6de46cd57f6201b70db53a
    pg_hba:
      - hostnossl all all all reject
    parameters:
      max_connections: "100"
      shared_buffers: 256MB
      log_connections: "on"
      log_disconnections: "on"
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-1-backup
        serverName: postgres-1-v18
