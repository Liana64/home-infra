---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-role-forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: postgres-role-forgejo
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: forgejo
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "2b97cb3d-61a4-4193-92fb-b4df00f84c99"
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: forgejo
spec:
  name: forgejo
  owner: forgejo
  cluster:
    name: postgres-1
  ensure: present
