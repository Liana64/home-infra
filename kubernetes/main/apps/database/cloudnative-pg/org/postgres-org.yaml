---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-org
spec:
  instances: 2
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:ec2ed3404e89fff99643901b58a2a34c46a46345fe69a3d96500b82f995c327b
  primaryUpdateStrategy: unsupervised
  storage:
    size: 32Gi
    storageClass: cluster-nvme
  enableSuperuserAccess: false
  certificates:
    serverTLSSecret: postgres-org-server
    serverCASecret: postgres-org-server
    clientCASecret: postgres-org-replication
    replicationTLSSecret: postgres-org-replication
  managed:
    roles:
      - name: fluxer
        ensure: present
        login: true
        passwordSecret:
          name: postgres-role-fluxer
  postgresql:
    pg_hba:
      - hostnossl all all all reject
    parameters:
      max_connections: "150"
      shared_buffers: 512MB
      log_connections: "on"
      log_disconnections: "on"
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-org-backup
        serverName: postgres-org-v18
