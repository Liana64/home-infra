---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-org-backup
spec:
  configuration:
    destinationPath: "s3://${CNPG_BUCKET}/postgres-org"
    endpointURL: "https://s3.${CNPG_B2_REGION:=us-east-005}.backblazeb2.com"
    s3Credentials:
      accessKeyId:
        name: cnpg-b2-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-b2-secret
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      encryption: AES256
      maxParallel: 2
    data:
      compression: gzip
      encryption: AES256
      jobs: 2
  retentionPolicy: "30d"
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 256Mi
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-org-daily
spec:
  schedule: "0 30 9 * * *"
  immediate: true
  backupOwnerReference: cluster
  cluster:
    name: postgres-org
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
