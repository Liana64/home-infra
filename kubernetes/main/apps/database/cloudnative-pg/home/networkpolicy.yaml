---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-home
spec:
  endpointSelector:
    matchLabels: &cluster
      cnpg.io/cluster: postgres-home
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            app.kubernetes.io/name: pgadmin
        - matchLabels:
            io.kubernetes.pod.namespace: home
            app.kubernetes.io/name: immich
        - matchLabels:
            io.kubernetes.pod.namespace: home
            app.kubernetes.io/name: linkding
        - matchLabels:
            io.kubernetes.pod.namespace: home
            app.kubernetes.io/name: miniflux
        - matchLabels:
            io.kubernetes.pod.namespace: labs
            app.kubernetes.io/name: atuin
        - matchLabels:
            io.kubernetes.pod.namespace: labs
            app.kubernetes.io/name: forgejo
        - matchLabels:
            io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: pinepods
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: grafana
        - matchLabels:
            io.kubernetes.pod.namespace: office
            app.kubernetes.io/name: meet
            app.kubernetes.io/controller: backend
        - matchLabels:
            io.kubernetes.pod.namespace: office
            app.kubernetes.io/name: docs
        - matchLabels:
            io.kubernetes.pod.namespace: security
            app.kubernetes.io/name: lldap
        - matchLabels:
            io.kubernetes.pod.namespace: security
            app.kubernetes.io/name: pocket-id
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels: *cluster
  egress:
    - toEndpoints:
        - matchLabels: *cluster
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toCIDR:
        - 149.137.128.0/20
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
