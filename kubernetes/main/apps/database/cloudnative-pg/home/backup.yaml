---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-home-backup
spec:
  configuration:
    destinationPath: "s3://${CNPG_BUCKET}/postgres-home"
    endpointURL: "https://s3.${CNPG_B2_REGION:=us-east-005}.backblazeb2.com"
    s3Credentials:
      accessKeyId:
        name: cnpg-b2-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-b2-secret
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      encryption: AES256
      maxParallel: 2
    data:
      compression: gzip
      encryption: AES256
      jobs: 2
  retentionPolicy: "30d"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-home-daily
spec:
  schedule: "0 0 9 * * *"
  immediate: true
  backupOwnerReference: cluster
  cluster:
    name: postgres-home
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
