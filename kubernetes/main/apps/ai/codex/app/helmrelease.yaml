---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app codex
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      codex:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/liana64/codex
              tag: 0.145.0@sha256:d2b78318851b8ca46abbe0f35fa8715f4d09d2bf4b227e3a20528a57d6f57f06
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      home:
        enabled: true
        storageClass: cluster-nvme
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /home/codex
      codex:
        enabled: true
        existingClaim: filebrowser-codex
        globalMounts:
          - path: /workspace/codex
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
