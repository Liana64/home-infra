---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: codex
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: codex
  ingress:
    # same-node ClusterIP SYN-ACK replies miss CT reverse-xlate, hit client ingress
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: labs
            app.kubernetes.io/name: forgejo
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: auth.openai.com
        - matchName: api.openai.com
        - matchName: chatgpt.com
        - matchName: github.com
        - matchName: gitlab.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: labs
            app.kubernetes.io/name: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "2222"
              protocol: TCP
