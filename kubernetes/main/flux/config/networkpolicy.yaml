---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: flux-system
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - health
    - fromEndpoints:
        - {}
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - {}
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-prometheus-metrics
  namespace: flux-system
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sources
  namespace: flux-system
spec:
  endpointSelector:
    matchLabels:
      app: source-controller
  egress:
    - toFQDNs:
        - matchName: github.com
        - matchPattern: "*.github.io"
        - matchPattern: "*.githubusercontent.com"
        - matchName: ghcr.io
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
        - matchName: production.cloudflare.docker.com
        - matchName: code.forgejo.org
        - matchName: charts.bitwarden.com
        - matchName: charts.jetstack.io
        - matchName: charts.rook.io
        - matchName: helm.cilium.io
        - matchName: helm.piped.video
        - matchName: piraeus.io
        - matchName: gitlab.com
        - matchName: grafana.com
        - matchName: tuf-repo-cdn.sigstore.dev
        - matchName: rekor.sigstore.dev
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notification-controller
  namespace: flux-system
spec:
  endpointSelector:
    matchLabels:
      app: notification-controller
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
