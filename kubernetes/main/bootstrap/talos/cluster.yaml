---
# renovate: datasource=github-releases depName=siderolabs/talos
talosVersion: v1.14.5
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.36.6
configContract: v1.13

name: milberry
endpoint: https://172.16.4.10:6443

nodes:
  n1: { ip: 172.16.4.11, role: controlplane }
  n2: { ip: 172.16.4.12, role: controlplane }
  n3: { ip: 172.16.4.13, role: controlplane }
  m1: { ip: 172.16.4.14, role: worker }

patches:
  global:
    - global/time.yaml
    - global/cluster-discovery.yaml
    - global/hostdns.yaml
    - global/kubelet.yaml
    - global/drbd.yaml
    - global/local-pool.yaml
    - global/openebs.yaml
    - global/sysctls.yaml
    - global/luks2.yaml
    - global/logging.yaml
    - global/containerd.yaml
    - global/network.yaml
    - global/install.yaml
    - global/security.yaml
  controlplane:
    - control/cluster.yaml
    - control/etcd.yaml
