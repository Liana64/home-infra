---
machine:
  install:
    diskSelector:
      size: < 200gb
  nodeLabels:
    hardware/manufacturer: asus
    hardware/model: tuf-z390m
    topology.kubernetes.io/region: us-central
    topology.kubernetes.io/zone: milberry
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: m1
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("52:54:00:c0:fe:15", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: eth0
