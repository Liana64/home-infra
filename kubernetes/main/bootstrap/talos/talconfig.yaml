---
# yaml-language-server: $schema=schemas/talconfig.json

# renovate: datasource=github-releases depName=siderolabs/talos
talosVersion: v1.14.5
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.36.6

clusterName: &clustername milberry

endpoint: https://172.16.4.10:6443
clusterPodNets: ["10.244.0.0/16"]
clusterSvcNets: ["10.86.0.0/16"]

additionalApiServerCertSans: &sans
  - &kubeapiip "172.16.4.10"
  - 127.0.0.1 # kubeprism
additionalMachineCertSans: *sans

nodes:
  - hostname: n1
    controlPlane: true
    ipAddress: 172.16.4.11
    installDiskSelector: &bootdisk
      size: < 200gb
    networkInterfaces:
      - interface: eth0
        dhcp: true
        vip:
          ip: *kubeapiip
      #- interface: eth1
      #  addresses:
      #    - 10.10.10.11/24
    machineSpec: &machineSpec
      mode: nocloud
      secureboot: true
    schematic: &schematicMinimal
      customization:
        bootloader: sd-boot
        extraKernelArgs:
          - -console
          - console=tty0
          - console=ttyS0
          - lockdown=integrity
          - ia32_emulation=0
          - init_on_free=1
          - page_alloc.shuffle=1
        systemExtensions:
          officialExtensions:
            - siderolabs/drbd
            - siderolabs/qemu-guest-agent
    patches: &clusterPatches
      - |
        machine:
          kubelet:
            nodeIP:
              validSubnets:
                - 172.16.4.0/24
            extraMounts:
              - destination: /var/mnt/local-pool
                type: bind
                source: /var/mnt/local-pool
                options:
                  - bind
                  - rshared
                  - rw
          disks:
            - device: /dev/sdb
              partitions:
                - mountpoint: /var/mnt/local-pool
      - "@./patches/mesh/etcd.yaml"
      - "@./patches/global/containerd.yaml"
    nodeLabels: &ms01cluster
      hardware/manufacturer: "minisforum"
      hardware/model: "ms-01"
      node-role.kubernetes.io/control-plane: "control-plane"
      topology.kubernetes.io/region: "us-central"
      topology.kubernetes.io/zone: *clustername
  - hostname: n2
    controlPlane: true
    ipAddress: 172.16.4.12
    installDiskSelector: *bootdisk
    networkInterfaces:
      - interface: eth0
        dhcp: true
        vip:
          ip: *kubeapiip
      #- interface: eth1
      #  addresses:
      #    - 10.10.10.12/24
    machineSpec: *machineSpec
    schematic: *schematicMinimal
    patches: *clusterPatches
    nodeLabels: *ms01cluster
  - hostname: n3
    nodeTaints:
      node-role.kubernetes.io/etcd-only: "true:NoSchedule"
    controlPlane: true
    ipAddress: 172.16.4.13
    installDiskSelector:
      size: "> 32GB"
    networkInterfaces:
      - interface: eth0
        dhcp: true
        vip:
          ip: *kubeapiip
    machineSpec: *machineSpec
    schematic: *schematicMinimal
    patches: *clusterPatches
    nodeLabels:
      hardware/manufacturer: "dell"
      hardware/model: "optiplex-7050"
      node-role.kubernetes.io/control-plane: "control-plane"
      topology.kubernetes.io/region: "us-central"
      topology.kubernetes.io/zone: *clustername
  - hostname: m1
    controlPlane: false
    ipAddress: 172.16.4.14
    installDiskSelector: *bootdisk
    networkInterfaces:
      - interface: eth0
        dhcp: true
      - deviceSelector:
          hardwareAddr: "52:54:00:c0:fe:15"
        dhcp: false
    machineSpec: *machineSpec
    schematic: *schematicMinimal
    patches:
      - |
        machine:
          kubelet:
            nodeIP:
              validSubnets:
                - 172.16.4.0/24
            extraMounts:
              - destination: /var/mnt/local-pool
                type: bind
                source: /var/mnt/local-pool
                options:
                  - bind
                  - rshared
                  - rw
          disks:
            - device: /dev/sdb
              partitions:
                - mountpoint: /var/mnt/local-pool
      - "@./patches/global/containerd.yaml"
    nodeLabels:
      hardware/manufacturer: "asus"
      hardware/model: "tuf-z390m"
      topology.kubernetes.io/region: "us-central"
      topology.kubernetes.io/zone: *clustername

patches:
  - "@./patches/global/time.yaml"
  - "@./patches/global/cluster-discovery.yaml"
  - "@./patches/global/hostdns.yaml"
  - "@./patches/global/kubelet.yaml"
  - "@./patches/global/drbd.yaml"
  - "@./patches/global/openebs.yaml"
  - "@./patches/global/sysctls.yaml"
  - "@./patches/global/luks2.yaml"
  - "@./patches/global/logging.yaml"

controlPlane:
  patches:
    - "@./patches/control/cluster.yaml"
