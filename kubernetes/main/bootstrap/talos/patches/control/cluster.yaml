---
cluster:
  allowSchedulingOnControlPlanes: true
  network:
    cni:
      name: none
  coreDNS:
    disabled: true
  proxy:
    disabled: true
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
machine:
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:etcd:backup
      allowedKubernetesNamespaces:
        - kube-system
