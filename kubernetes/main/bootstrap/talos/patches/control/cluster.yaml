---
cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    certSANs:
      - 172.16.4.10
      - 127.0.0.1
  network:
    cni:
      name: none
  coreDNS:
    disabled: true
  proxy:
    disabled: true
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
machine:
  nodeLabels:
    node.kubernetes.io/exclude-from-external-load-balancers:
      $patch: delete
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:etcd:backup
      allowedKubernetesNamespaces:
        - kube-system
